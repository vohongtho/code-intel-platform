schema: spec-driven

context: |
  Project: Code Intelligence Platform
  Release target: v1.0.12
  Source baseline: main @ 20e46e8a251eaf52772388a5ef67b4fa290f934f
  Working branch: release/1.0.12

  Runtime and language:
  - Node.js >= 22
  - TypeScript 5.x/6.x compatible project configuration
  - ESM modules with explicit .js import suffixes
  - npm workspaces

  Existing v1.0.11 foundations that MUST be reused:
  - Generation V2 atomic publication and index trust
  - canonical symbol/call-site identity and evidence-backed relationship certainty
  - framework semantic adapters
  - graph-aware HTTP API contracts and consumer response-key evidence
  - semantic snapshots and branch-aware graph diff
  - cross-repository contract drift
  - graph-backed agent workflow registry/assets
  - universal program-analysis IR, CFG, dataflow, summaries, PDG and bounded taint
  - token-budgeted context builder with adaptive snippets and session-aware delivery
  - BM25/vector hybrid search
  - self-contained runtime lifecycle with checksum/SBOM/provenance artifacts

  v1.0.12 strategic objective:
  - Make existing intelligence more actionable for real change execution and review.
  - Reduce agent tool-selection and context cost without weakening evidence boundaries.
  - Turn branch snapshots into queryable/shareable ref-aware indexes.
  - Connect PDG precision to PR impact and test selection.
  - Complete GraphQL/gRPC and consumer-shape contract intelligence.
  - Add safe semantic refactoring and architecture/policy checks.
  - Make advanced taint/dispatch modeling extensible.
  - Stitch cross-repository contracts into system/business flows and checkpointed agent workflows.
  - Strengthen runtime artifact authenticity and offline installation.

  Engineering constraints:
  - Extend existing modules before creating new engines.
  - Existing current-repo tool behavior is the default; new precision/ref/workflow options are additive.
  - Never report no impact/no consumer/no test/no taint path as proof of safety when analysis coverage is incomplete.
  - No persisted format without schema version + producer fingerprint + migration/compatibility behavior.
  - Keep statement-level program-analysis artifacts separate from the main semantic graph unless a focused projection is required.
  - Refactoring edits are dry-run by default and exact-certainty only unless explicitly opted into candidates.
  - Portable index import is untrusted input.
  - No new runtime dependency without license/security audit.
  - GitNexus-inspired behavior is clean-room only.
  - Default MCP responses remain bounded and compact.
  - All agent-facing outputs use stable ordering and explicit coverage/truncation fields.

rules:
  proposal:
    - State the source-verified v1.0.11 baseline and distinguish existing capability from the remaining gap.
    - Map the change to the feature IDs in the v1.0.12 release program.
    - Include user workflow, scope, non-goals, compatibility, migration, dependencies, performance, risk, security, and license/IP.
    - Name the existing implementation that will be reused.
  specs:
    - Use ADDED, MODIFIED, or REMOVED requirement sections.
    - Every requirement must include at least one GIVEN/WHEN/THEN scenario.
    - Include ambiguity, unsupported-language, truncation, stale-index, migration, and failure scenarios where relevant.
    - Specify observable contracts rather than only implementation details.
  design:
    - Begin with the observed v1.0.11 control flow and ownership boundaries.
    - Name exact source modules and intended new modules.
    - Define invariants, schema/fingerprint ownership, failure semantics, observability, performance budgets, rollout and rollback.
    - Include alternatives rejected and explain why.
  tasks:
    - Use unchecked Markdown checkboxes.
    - Name source and test files to create/modify.
    - Name key symbols/contracts to add or change.
    - Include docs, OpenAPI/MCP schema, migration, packaging, benchmark, 15-language, and release-gate work where applicable.
