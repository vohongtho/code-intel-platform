name: Implement Generation V2

on:
  push:
    branches:
      - branch/1.0.10
    paths:
      - .github/workflows/implement-generation-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch/1.0.10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Generation V2 implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          (root / 'code-intel/core/src/storage/index-snapshot.ts').write_text(r'''import fs from 'node:fs';
import path from 'node:path';
import {
  getCurrentManifestPath,
  loadCurrentGenerationManifest,
  type IndexArtifactName,
  type IndexGenerationManifest,
} from './index-generation.js';

export interface IndexSnapshot {
  repositoryRoot: string;
  generationId: string;
  generationDir: string;
  legacy: boolean;
  manifest: IndexGenerationManifest | null;
  graphDbPath: string;
  bm25DbPath: string;
  vectorDbPath: string;
  metadataPath: string;
}

function isSafeGenerationId(value: string): boolean {
  return value.length > 0
    && value !== '.'
    && value !== '..'
    && path.basename(value) === value;
}

function buildSnapshot(
  repositoryRoot: string,
  generationId: string,
  generationDir: string,
  legacy: boolean,
  manifest: IndexGenerationManifest | null,
): IndexSnapshot {
  return Object.freeze({
    repositoryRoot,
    generationId,
    generationDir,
    legacy,
    manifest,
    graphDbPath: path.join(generationDir, 'graph.db'),
    bm25DbPath: path.join(generationDir, 'bm25.db'),
    vectorDbPath: path.join(generationDir, 'vector.db'),
    metadataPath: path.join(generationDir, 'meta.json'),
  });
}

export function resolveIndexSnapshot(repoDir: string): IndexSnapshot | null {
  const repositoryRoot = path.resolve(repoDir);
  const staging = process.env['CODE_INTEL_INDEX_STAGING_DIR']?.trim();
  if (staging) {
    const generationDir = path.resolve(staging);
    if (fs.existsSync(generationDir)) {
      const name = path.basename(generationDir).replace(/^\.staging-/, '');
      return buildSnapshot(repositoryRoot, name || 'staging', generationDir, false, null);
    }
  }

  const manifest = loadCurrentGenerationManifest(repositoryRoot);
  if (manifest && isSafeGenerationId(manifest.generationId)) {
    const generationDir = path.join(repositoryRoot, '.code-intel', 'generations', manifest.generationId);
    if (fs.existsSync(generationDir) && fs.statSync(generationDir).isDirectory()) {
      return buildSnapshot(repositoryRoot, manifest.generationId, generationDir, false, manifest);
    }
  }

  const legacyDir = path.join(repositoryRoot, '.code-intel');
  const legacyArtifacts: IndexArtifactName[] = ['graph.db', 'bm25.db', 'vector.db', 'meta.json'];
  if (legacyArtifacts.some((artifact) => fs.existsSync(path.join(legacyDir, artifact)))) {
    return buildSnapshot(repositoryRoot, 'legacy', legacyDir, true, null);
  }
  return null;
}

export function getSnapshotArtifactPath(
  snapshot: IndexSnapshot,
  artifact: IndexArtifactName,
): string {
  switch (artifact) {
    case 'graph.db': return snapshot.graphDbPath;
    case 'bm25.db': return snapshot.bm25DbPath;
    case 'vector.db': return snapshot.vectorDbPath;
    case 'meta.json': return snapshot.metadataPath;
  }
}

export function snapshotStillCurrent(snapshot: IndexSnapshot): boolean {
  if (snapshot.legacy) return !fs.existsSync(getCurrentManifestPath(snapshot.repositoryRoot));
  return loadCurrentGenerationManifest(snapshot.repositoryRoot)?.generationId === snapshot.generationId;
}
''')

          (root / 'code-intel/core/src/storage/analyze-lock.ts').write_text(r'''import crypto from 'node:crypto';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';

const DEFAULT_STALE_AFTER_MS = 24 * 60 * 60 * 1000;

export interface AnalyzeLockOwner {
  version: 1;
  token: string;
  pid: number;
  hostname: string;
  startedAt: string;
  baseGenerationId?: string;
  stagingGenerationId?: string;
}

export interface AnalyzeLock {
  lockPath: string;
  owner: AnalyzeLockOwner;
  update(patch: Partial<Pick<AnalyzeLockOwner, 'baseGenerationId' | 'stagingGenerationId'>>): void;
  release(): void;
}

export class AnalysisAlreadyRunningError extends Error {
  constructor(public readonly existingOwner: AnalyzeLockOwner | null, lockPath: string) {
    const detail = existingOwner
      ? `PID ${existingOwner.pid} on ${existingOwner.hostname}, started ${existingOwner.startedAt}`
      : `lock file ${lockPath}`;
    super(`Analysis is already running for this repository (${detail})`);
    this.name = 'AnalysisAlreadyRunningError';
  }
}

export function getAnalyzeLockPath(repoDir: string): string {
  return path.join(path.resolve(repoDir), '.code-intel', 'analyze.lock');
}

function readOwner(lockPath: string): AnalyzeLockOwner | null {
  try {
    const value = JSON.parse(fs.readFileSync(lockPath, 'utf8')) as AnalyzeLockOwner;
    if (value.version !== 1 || !value.token || !Number.isInteger(value.pid) || !value.hostname || !value.startedAt) {
      return null;
    }
    return value;
  } catch {
    return null;
  }
}

function processAlive(pid: number): boolean {
  if (pid <= 0) return false;
  try {
    process.kill(pid, 0);
    return true;
  } catch (error) {
    return (error as NodeJS.ErrnoException).code === 'EPERM';
  }
}

function canRecoverStaleLock(
  lockPath: string,
  owner: AnalyzeLockOwner | null,
  staleAfterMs: number,
): boolean {
  const age = (() => {
    try { return Date.now() - fs.statSync(lockPath).mtimeMs; } catch { return Number.POSITIVE_INFINITY; }
  })();
  if (!owner) return age >= staleAfterMs;
  if (owner.hostname !== os.hostname()) return false;
  return !processAlive(owner.pid) || age >= staleAfterMs;
}

function atomicRewrite(lockPath: string, owner: AnalyzeLockOwner): void {
  const tmp = `${lockPath}.tmp-${process.pid}-${Date.now()}`;
  fs.writeFileSync(tmp, `${JSON.stringify(owner, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });
  fs.renameSync(tmp, lockPath);
}

export function acquireAnalyzeLock(
  repoDir: string,
  options: { staleAfterMs?: number; baseGenerationId?: string } = {},
): AnalyzeLock {
  const repositoryRoot = path.resolve(repoDir);
  if (!fs.existsSync(repositoryRoot) || !fs.statSync(repositoryRoot).isDirectory()) {
    throw new Error(`Cannot analyze missing repository directory: ${repositoryRoot}`);
  }
  const lockPath = getAnalyzeLockPath(repositoryRoot);
  fs.mkdirSync(path.dirname(lockPath), { recursive: true });
  const staleAfterMs = options.staleAfterMs ?? DEFAULT_STALE_AFTER_MS;

  for (let attempt = 0; attempt < 2; attempt += 1) {
    const owner: AnalyzeLockOwner = {
      version: 1,
      token: crypto.randomUUID(),
      pid: process.pid,
      hostname: os.hostname(),
      startedAt: new Date().toISOString(),
      baseGenerationId: options.baseGenerationId,
    };
    try {
      const fd = fs.openSync(lockPath, 'wx', 0o600);
      try { fs.writeFileSync(fd, `${JSON.stringify(owner, null, 2)}\n`, 'utf8'); } finally { fs.closeSync(fd); }
      return {
        lockPath,
        owner,
        update(patch) {
          const current = readOwner(lockPath);
          if (!current || current.token !== owner.token) return;
          Object.assign(owner, patch);
          atomicRewrite(lockPath, owner);
        },
        release() {
          const current = readOwner(lockPath);
          if (current?.token === owner.token) fs.rmSync(lockPath, { force: true });
        },
      };
    } catch (error) {
      if ((error as NodeJS.ErrnoException).code !== 'EEXIST') throw error;
      const existing = readOwner(lockPath);
      if (attempt === 0 && canRecoverStaleLock(lockPath, existing, staleAfterMs)) {
        fs.rmSync(lockPath, { force: true });
        continue;
      }
      throw new AnalysisAlreadyRunningError(existing, lockPath);
    }
  }
  throw new AnalysisAlreadyRunningError(readOwner(lockPath), lockPath);
}
''')

          (root / 'code-intel/core/src/pipeline/analysis-plan.ts').write_text(r'''import fs from 'node:fs';
import path from 'node:path';
import { getChangedFilesSince } from './incremental.js';
import type { IndexMetadata } from '../storage/metadata.js';
import type { IndexArtifactName } from '../storage/index-generation.js';
import type { IndexSnapshot } from '../storage/index-snapshot.js';

export type SourceChangeKind = 'unchanged' | 'changed' | 'unknown';

export interface SourceChangeState {
  kind: SourceChangeKind;
  changedPaths: string[];
  reason: string;
}

export type AtomicAnalysisPlan =
  | { mode: 'passthrough'; reason: 'dry-run' }
  | { mode: 'noop'; reason: string; source: SourceChangeState }
  | {
      mode: 'publish';
      reason: string;
      source: SourceChangeState;
      graph: 'full' | 'preserve';
      bm25: 'full' | 'preserve';
      vector: 'full' | 'incremental' | 'preserve' | 'disabled';
      seedArtifacts: IndexArtifactName[];
    };

function normalize(value: string): string {
  return value.replace(/\\/g, '/').replace(/^\.\//, '');
}

export function detectSourceChangeState(
  repoDir: string,
  metadata: IndexMetadata | null,
): SourceChangeState {
  if (!metadata?.commitHash) {
    return { kind: 'unknown', changedPaths: [], reason: 'previous commit hash unavailable' };
  }
  const gitChanged = getChangedFilesSince(repoDir, metadata.commitHash);
  if (gitChanged === null) {
    return { kind: 'unknown', changedPaths: [], reason: 'git change detection failed' };
  }
  const changed = new Set(gitChanged.map(normalize));
  for (const [relativePath, previousMtime] of Object.entries(metadata.lastAnalyzedMtimes ?? {})) {
    const normalized = normalize(relativePath);
    try {
      if (fs.statSync(path.join(repoDir, normalized)).mtimeMs !== previousMtime) changed.add(normalized);
    } catch {
      changed.add(normalized);
    }
  }
  const changedPaths = [...changed].sort();
  return changedPaths.length === 0
    ? { kind: 'unchanged', changedPaths, reason: 'git and stored mtimes report no changes' }
    : { kind: 'changed', changedPaths, reason: `${changedPaths.length} changed or deleted path(s)` };
}

function exists(filePath: string | undefined): boolean {
  if (!filePath) return false;
  try { return fs.statSync(filePath).isFile() && fs.statSync(filePath).size > 0; } catch { return false; }
}

function hasArg(args: string[], name: string): boolean {
  return args.some((arg) => arg === name || arg.startsWith(`${name}=`));
}

function unique<T>(values: T[]): T[] {
  return [...new Set(values)];
}

export function resolveAnalysisPlan(input: {
  args: string[];
  metadata: IndexMetadata | null;
  snapshot: IndexSnapshot | null;
  source: SourceChangeState;
}): AtomicAnalysisPlan {
  const { args, metadata, snapshot, source } = input;
  if (hasArg(args, '--dry-run')) return { mode: 'passthrough', reason: 'dry-run' };

  const force = hasArg(args, '--force');
  const graphExists = exists(snapshot?.graphDbPath);
  const bm25Exists = exists(snapshot?.bm25DbPath);
  const vectorExists = exists(snapshot?.vectorDbPath);
  const metadataExists = exists(snapshot?.metadataPath);
  const vectorEnabled = Boolean(metadata?.embeddings?.enabled);
  const vectorHealthy = Boolean(vectorEnabled && metadata?.embeddings?.status === 'ready' && vectorExists);
  const requiredArtifactsPresent = graphExists && bm25Exists && metadataExists && (!vectorEnabled || vectorExists);
  const nonSourceWork = [
    '--summarize', '--profile', '--skip-folders', '--skip-files',
    '--llm-provider', '--llm-model', '--llm-base-url', '--llm-api-key',
    '--llm-batch-size', '--llm-max-nodes',
  ].some((flag) => hasArg(args, flag));
  const embeddingWork = hasArg(args, '--embeddings') && !vectorHealthy;

  if (!metadata || !snapshot) {
    return {
      mode: 'publish', reason: 'initial analysis', source,
      graph: 'full', bm25: 'full', vector: hasArg(args, '--embeddings') ? 'full' : 'disabled', seedArtifacts: [],
    };
  }
  if (force) {
    return {
      mode: 'publish', reason: 'forced analysis', source,
      graph: 'full', bm25: 'full', vector: vectorEnabled || hasArg(args, '--embeddings') ? 'full' : 'disabled', seedArtifacts: [],
    };
  }
  if (snapshot.legacy || metadata.schemaVersion === undefined || metadata.parser === 'regex') {
    const seedArtifacts: IndexArtifactName[] = [];
    if (graphExists) seedArtifacts.push('graph.db');
    if (bm25Exists) seedArtifacts.push('bm25.db');
    if (vectorExists) seedArtifacts.push('vector.db');
    return {
      mode: 'publish', reason: 'legacy index migration', source,
      graph: 'preserve', bm25: 'preserve', vector: vectorExists ? 'preserve' : 'disabled', seedArtifacts,
    };
  }
  if (source.kind === 'unchanged' && requiredArtifactsPresent && !nonSourceWork && !embeddingWork) {
    return { mode: 'noop', reason: 'no source or index changes detected', source };
  }

  if (source.kind === 'changed') {
    return {
      mode: 'publish', reason: source.reason, source,
      graph: 'full', bm25: 'full',
      vector: vectorEnabled ? (vectorHealthy ? 'incremental' : 'full') : (hasArg(args, '--embeddings') ? 'full' : 'disabled'),
      seedArtifacts: vectorHealthy ? ['vector.db'] : [],
    };
  }

  const seedArtifacts: IndexArtifactName[] = [];
  if (graphExists) seedArtifacts.push('graph.db');
  if (bm25Exists) seedArtifacts.push('bm25.db');
  if (vectorExists) seedArtifacts.push('vector.db');
  return {
    mode: 'publish',
    reason: !requiredArtifactsPresent ? 'required index artifact missing' : nonSourceWork || embeddingWork ? 'explicit analysis work requested' : source.reason,
    source,
    graph: graphExists ? 'preserve' : 'full',
    bm25: bm25Exists ? 'preserve' : 'full',
    vector: vectorEnabled || hasArg(args, '--embeddings')
      ? (vectorExists && !embeddingWork ? 'preserve' : 'full')
      : 'disabled',
    seedArtifacts: unique(seedArtifacts),
  };
}

export function planAtomicAnalysis(
  repoDir: string,
  args: string[],
  metadata: IndexMetadata | null,
  snapshot: IndexSnapshot | null,
): AtomicAnalysisPlan {
  return resolveAnalysisPlan({
    args,
    metadata,
    snapshot,
    source: detectSourceChangeState(repoDir, metadata),
  });
}
''')

          (root / 'code-intel/core/src/storage/index-generation.ts').write_text(r'''import crypto from 'node:crypto';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';

export const INDEX_DIR = '.code-intel';
export const GENERATIONS_DIR = 'generations';
export const CURRENT_FILE = 'current.json';
export const STAGING_OWNER_FILE = 'staging.json';
export const DEFAULT_STALE_STAGING_MS = 24 * 60 * 60 * 1000;

export type IndexArtifactName = 'graph.db' | 'bm25.db' | 'vector.db' | 'meta.json';
export type ArtifactCloneMode = 'reflink' | 'copy';

export interface IndexGenerationManifest {
  version?: 1 | 2;
  generationId: string;
  publishedAt: string;
  baseGenerationId?: string;
  artifacts: IndexArtifactName[];
}

export interface IndexGeneration {
  generationId: string;
  baseGenerationId?: string;
  stagingDir: string;
  finalDir: string;
  graphDbPath: string;
  bm25DbPath: string;
  vectorDbPath: string;
  metadataPath: string;
}

export interface StagingOwner {
  version: 1;
  generationId: string;
  baseGenerationId?: string;
  pid: number;
  hostname: string;
  createdAt: string;
  lastActivityAt: string;
}

export function getIndexDir(repoDir: string): string {
  return path.join(path.resolve(repoDir), INDEX_DIR);
}

export function getGenerationsDir(repoDir: string): string {
  return path.join(getIndexDir(repoDir), GENERATIONS_DIR);
}

export function getCurrentManifestPath(repoDir: string): string {
  return path.join(getIndexDir(repoDir), CURRENT_FILE);
}

function safeGenerationId(value: string): boolean {
  return value.length > 0 && value !== '.' && value !== '..' && path.basename(value) === value;
}

function atomicWriteJson(filePath: string, value: unknown): void {
  fs.mkdirSync(path.dirname(filePath), { recursive: true });
  const tmp = `${filePath}.tmp-${process.pid}-${Date.now()}`;
  fs.writeFileSync(tmp, `${JSON.stringify(value, null, 2)}\n`, 'utf8');
  fs.renameSync(tmp, filePath);
}

export function loadCurrentGenerationManifest(repoDir: string): IndexGenerationManifest | null {
  try {
    const value = JSON.parse(fs.readFileSync(getCurrentManifestPath(repoDir), 'utf8')) as IndexGenerationManifest;
    if (!safeGenerationId(value.generationId) || !Array.isArray(value.artifacts)) return null;
    if (!value.artifacts.every((artifact) => ['graph.db', 'bm25.db', 'vector.db', 'meta.json'].includes(artifact))) return null;
    return value;
  } catch {
    return null;
  }
}

export function getPublishedGenerationDir(repoDir: string): string | null {
  const manifest = loadCurrentGenerationManifest(repoDir);
  if (!manifest) return null;
  const dir = path.join(getGenerationsDir(repoDir), manifest.generationId);
  return fs.existsSync(dir) ? dir : null;
}

export function resolvePublishedArtifactPath(repoDir: string, artifact: IndexArtifactName): string {
  const staging = process.env['CODE_INTEL_INDEX_STAGING_DIR']?.trim();
  if (staging) return path.join(path.resolve(staging), artifact);
  const generationDir = getPublishedGenerationDir(repoDir);
  if (generationDir) return path.join(generationDir, artifact);
  return path.join(getIndexDir(repoDir), artifact);
}

function ownerFor(generation: IndexGeneration): StagingOwner {
  const now = new Date().toISOString();
  return {
    version: 1,
    generationId: generation.generationId,
    baseGenerationId: generation.baseGenerationId,
    pid: process.pid,
    hostname: os.hostname(),
    createdAt: now,
    lastActivityAt: now,
  };
}

export function createIndexGeneration(
  repoDir: string,
  generationId = `${Date.now()}-${crypto.randomUUID()}`,
  options: { baseGenerationId?: string } = {},
): IndexGeneration {
  if (!safeGenerationId(generationId)) throw new Error(`Invalid index generation ID: ${generationId}`);
  const root = getGenerationsDir(repoDir);
  fs.mkdirSync(root, { recursive: true });
  const stagingDir = path.join(root, `.staging-${generationId}`);
  const finalDir = path.join(root, generationId);
  fs.rmSync(stagingDir, { recursive: true, force: true });
  fs.mkdirSync(stagingDir, { recursive: true });
  const generation: IndexGeneration = {
    generationId,
    baseGenerationId: options.baseGenerationId,
    stagingDir,
    finalDir,
    graphDbPath: path.join(stagingDir, 'graph.db'),
    bm25DbPath: path.join(stagingDir, 'bm25.db'),
    vectorDbPath: path.join(stagingDir, 'vector.db'),
    metadataPath: path.join(stagingDir, 'meta.json'),
  };
  atomicWriteJson(path.join(stagingDir, STAGING_OWNER_FILE), ownerFor(generation));
  return generation;
}

export function touchIndexGeneration(generation: IndexGeneration): void {
  const ownerPath = path.join(generation.stagingDir, STAGING_OWNER_FILE);
  try {
    const owner = JSON.parse(fs.readFileSync(ownerPath, 'utf8')) as StagingOwner;
    owner.lastActivityAt = new Date().toISOString();
    atomicWriteJson(ownerPath, owner);
  } catch {
    atomicWriteJson(ownerPath, ownerFor(generation));
  }
}

export function cloneArtifact(source: string, target: string): ArtifactCloneMode {
  fs.mkdirSync(path.dirname(target), { recursive: true });
  try {
    fs.copyFileSync(source, target, fs.constants.COPYFILE_FICLONE_FORCE);
    return 'reflink';
  } catch {
    try {
      fs.copyFileSync(source, target, fs.constants.COPYFILE_FICLONE);
      return 'reflink';
    } catch {
      fs.copyFileSync(source, target);
      return 'copy';
    }
  }
}

export function cloneGenerationArtifact(source: string, target: string): ArtifactCloneMode {
  const mode = cloneArtifact(source, target);
  for (const suffix of ['-wal', '-shm']) {
    const sidecar = `${source}${suffix}`;
    if (fs.existsSync(sidecar)) cloneArtifact(sidecar, `${target}${suffix}`);
  }
  return mode;
}

function assertArtifact(filePath: string, name: string): void {
  const stat = fs.statSync(filePath, { throwIfNoEntry: false });
  if (!stat?.isFile() || stat.size <= 0) {
    throw new Error(`Index generation validation failed: ${name} is missing or empty`);
  }
}

export function cleanupStaleStaging(
  repoDir: string,
  options: { staleAfterMs?: number; activeGenerationId?: string; nowMs?: number } = {},
): string[] {
  const root = getGenerationsDir(repoDir);
  if (!fs.existsSync(root)) return [];
  const staleAfterMs = options.staleAfterMs ?? DEFAULT_STALE_STAGING_MS;
  const nowMs = options.nowMs ?? Date.now();
  const removed: string[] = [];
  for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
    if (!entry.isDirectory() || !entry.name.startsWith('.staging-')) continue;
    const generationId = entry.name.slice('.staging-'.length);
    if (generationId === options.activeGenerationId) continue;
    const entryPath = path.join(root, entry.name);
    let activityMs = fs.statSync(entryPath).mtimeMs;
    try {
      const owner = JSON.parse(fs.readFileSync(path.join(entryPath, STAGING_OWNER_FILE), 'utf8')) as StagingOwner;
      const parsed = Date.parse(owner.lastActivityAt || owner.createdAt);
      if (Number.isFinite(parsed)) activityMs = parsed;
    } catch {
      // Invalid owner data is removable only after the same conservative TTL.
    }
    if (nowMs - activityMs < staleAfterMs) continue;
    fs.rmSync(entryPath, { recursive: true, force: true });
    removed.push(generationId);
  }
  return removed;
}

export function publishIndexGeneration(
  repoDir: string,
  generation: IndexGeneration,
  metadata: unknown,
  options: { vectorRequired?: boolean; keepGenerations?: number } = {},
): IndexGenerationManifest {
  assertArtifact(generation.graphDbPath, 'graph.db');
  assertArtifact(generation.bm25DbPath, 'bm25.db');
  if (options.vectorRequired) assertArtifact(generation.vectorDbPath, 'vector.db');

  const metadataValue = metadata && typeof metadata === 'object'
    ? { ...(metadata as Record<string, unknown>), generationId: generation.generationId }
    : metadata;
  atomicWriteJson(generation.metadataPath, metadataValue);
  assertArtifact(generation.metadataPath, 'meta.json');
  fs.rmSync(path.join(generation.stagingDir, STAGING_OWNER_FILE), { force: true });

  fs.rmSync(generation.finalDir, { recursive: true, force: true });
  fs.renameSync(generation.stagingDir, generation.finalDir);

  const artifacts: IndexArtifactName[] = ['graph.db', 'bm25.db', 'meta.json'];
  if (fs.existsSync(path.join(generation.finalDir, 'vector.db'))) artifacts.push('vector.db');
  const manifest: IndexGenerationManifest = {
    version: 2,
    generationId: generation.generationId,
    baseGenerationId: generation.baseGenerationId,
    publishedAt: new Date().toISOString(),
    artifacts,
  };
  atomicWriteJson(getCurrentManifestPath(repoDir), manifest);
  cleanupOldGenerations(repoDir, options.keepGenerations ?? 2, generation.generationId);
  return manifest;
}

export function abortIndexGeneration(generation: IndexGeneration): void {
  fs.rmSync(generation.stagingDir, { recursive: true, force: true });
}

export function cleanupOldGenerations(repoDir: string, keep: number, currentGenerationId?: string): void {
  const root = getGenerationsDir(repoDir);
  if (!fs.existsSync(root)) return;
  const entries = fs.readdirSync(root, { withFileTypes: true })
    .filter((entry) => entry.isDirectory() && !entry.name.startsWith('.staging-'))
    .map((entry) => ({
      name: entry.name,
      path: path.join(root, entry.name),
      mtimeMs: fs.statSync(path.join(root, entry.name)).mtimeMs,
    }))
    .sort((a, b) => b.mtimeMs - a.mtimeMs);
  const retained = new Set(entries.slice(0, Math.max(1, keep)).map((entry) => entry.name));
  if (currentGenerationId) retained.add(currentGenerationId);
  for (const entry of entries) {
    if (!retained.has(entry.name)) fs.rmSync(entry.path, { recursive: true, force: true });
  }
  cleanupStaleStaging(repoDir);
}

export function migrateLegacyIndexToGeneration(repoDir: string): IndexGenerationManifest | null {
  if (loadCurrentGenerationManifest(repoDir)) return loadCurrentGenerationManifest(repoDir);
  const legacyDir = getIndexDir(repoDir);
  const required = ['graph.db', 'bm25.db', 'meta.json'] as const;
  if (!required.every((name) => fs.existsSync(path.join(legacyDir, name)))) return null;
  const generation = createIndexGeneration(repoDir, `legacy-${Date.now()}-${crypto.randomUUID()}`);
  for (const artifact of ['graph.db', 'bm25.db', 'vector.db'] as const) {
    const source = path.join(legacyDir, artifact);
    if (fs.existsSync(source)) cloneGenerationArtifact(source, path.join(generation.stagingDir, artifact));
  }
