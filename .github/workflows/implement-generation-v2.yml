          (root / 'code-intel/core/src/cli/atomic-analyze.ts').write_text(r'''import fs from 'node:fs';
import path from 'node:path';
import { fileURLToPath } from 'node:url';
import { spawnSync } from 'node:child_process';
import {
  abortIndexGeneration,
  cloneGenerationArtifact,
  createIndexGeneration,
  publishIndexGeneration,
  touchIndexGeneration,
  type ArtifactCloneMode,
  type IndexArtifactName,
  type IndexGeneration,
} from '../storage/index-generation.js';
import { acquireAnalyzeLock } from '../storage/analyze-lock.js';
import {
  getSnapshotArtifactPath,
  resolveIndexSnapshot,
  type IndexSnapshot,
} from '../storage/index-snapshot.js';
import { planAtomicAnalysis } from '../pipeline/analysis-plan.js';
import type { IndexMetadata } from '../storage/metadata.js';

const ANALYZE_VALUE_OPTIONS = new Set([
  '--name', '--llm-provider', '--llm-model', '--llm-base-url', '--llm-api-key',
  '--llm-batch-size', '--llm-max-nodes', '--max-memory',
]);
const ANALYZE_VARIADIC_OPTIONS = new Set(['--skip-folders', '--skip-files']);

export function resolveAnalyzeWorkspaceRoot(args: string[], cwd = process.cwd()): string {
  const analyzeIndex = args.indexOf('analyze');
  if (analyzeIndex < 0) return cwd;
  for (let i = analyzeIndex + 1; i < args.length; i += 1) {
    const token = args[i]!;
    if (token === '--') {
      const positional = args[i + 1];
      return path.resolve(cwd, positional ?? '.');
    }
    if (!token.startsWith('-')) return path.resolve(cwd, token);
    const optionName = token.split('=', 1)[0]!;
    if (token.includes('=')) continue;
    if (ANALYZE_VALUE_OPTIONS.has(optionName)) {
      i += 1;
      continue;
    }
    if (ANALYZE_VARIADIC_OPTIONS.has(optionName)) {
      while (i + 1 < args.length && !args[i + 1]!.startsWith('-')) i += 1;
    }
  }
  return cwd;
}

function loadSnapshotMetadata(snapshot: IndexSnapshot | null): IndexMetadata | null {
  if (!snapshot || !fs.existsSync(snapshot.metadataPath)) return null;
  try { return JSON.parse(fs.readFileSync(snapshot.metadataPath, 'utf8')) as IndexMetadata; } catch { return null; }
}

export function seedIndexGeneration(
  repoDir: string,
  generation: IndexGeneration,
  snapshot: IndexSnapshot | null = resolveIndexSnapshot(repoDir),
  artifacts: IndexArtifactName[] = ['graph.db', 'bm25.db', 'vector.db'],
): Partial<Record<IndexArtifactName, ArtifactCloneMode>> {
  const modes: Partial<Record<IndexArtifactName, ArtifactCloneMode>> = {};
  if (!snapshot) return modes;
  for (const artifact of artifacts) {
    if (artifact === 'meta.json') continue;
    const source = getSnapshotArtifactPath(snapshot, artifact);
    if (!fs.existsSync(source)) continue;
    const target = path.join(generation.stagingDir, artifact);
    modes[artifact] = cloneGenerationArtifact(source, target);
  }
  touchIndexGeneration(generation);
  return modes;
}

function runChild(args: string[], binUrl: URL, extraEnv: NodeJS.ProcessEnv = {}): number {
  const child = spawnSync(process.execPath, [fileURLToPath(binUrl), ...args], {
    stdio: 'inherit',
    env: {
      ...process.env,
      ...extraEnv,
      CODE_INTEL_ATOMIC_CHILD: '1',
    },
  });
  return child.status ?? 1;
}

/**
 * Run analyze against an isolated staging directory and publish only after all
 * required artifacts validate. A repository lock serializes analyze processes.
 */
export function runAtomicAnalyze(args: string[], binUrl: URL): number {
  const workspaceRoot = resolveAnalyzeWorkspaceRoot(args);
  let lock: ReturnType<typeof acquireAnalyzeLock> | null = null;
  try {
    const snapshot = resolveIndexSnapshot(workspaceRoot);
    lock = acquireAnalyzeLock(workspaceRoot, {
      baseGenerationId: snapshot && !snapshot.legacy ? snapshot.generationId : undefined,
    });
    const previous = loadSnapshotMetadata(snapshot);
    const plan = planAtomicAnalysis(workspaceRoot, args, previous, snapshot);

    if (plan.mode === 'passthrough') {
      return runChild(args, binUrl);
    }
    if (plan.mode === 'noop') {
      console.log('  ✓ No source or index changes detected');
      console.log(`  ✓ Active generation preserved: ${snapshot?.generationId ?? 'legacy'}`);
      return 0;
    }

    const generation = createIndexGeneration(workspaceRoot, undefined, {
      baseGenerationId: snapshot && !snapshot.legacy ? snapshot.generationId : undefined,
    });
    lock.update({ stagingGenerationId: generation.generationId });
    seedIndexGeneration(workspaceRoot, generation, snapshot, plan.seedArtifacts);
    const childArgs = [...args];

    if (
      previous?.embeddings?.enabled
      && !childArgs.includes('--embeddings')
      && !childArgs.includes('--skip-embeddings')
    ) {
      childArgs.push('--embeddings');
    }

    const childStatus = runChild(childArgs, binUrl, {
      CODE_INTEL_INDEX_STAGING_DIR: generation.stagingDir,
      CODE_INTEL_ANALYSIS_PLAN: JSON.stringify(plan),
    });
    if (childStatus !== 0) {
      abortIndexGeneration(generation);
      return childStatus;
    }

    try {
      touchIndexGeneration(generation);
      const metadata = JSON.parse(fs.readFileSync(generation.metadataPath, 'utf8')) as IndexMetadata;
      metadata.generationId = generation.generationId;
      publishIndexGeneration(workspaceRoot, generation, metadata, {
        vectorRequired: Boolean(metadata.embeddings?.enabled && metadata.embeddings.status === 'ready'),
      });
      return 0;
    } catch (error) {
      abortIndexGeneration(generation);
      console.error(`Atomic index publication failed: ${error instanceof Error ? error.message : String(error)}`);
      return 1;
    }
  } catch (error) {
    console.error(error instanceof Error ? error.message : String(error));
    return 1;
  } finally {
    lock?.release();
  }
}
''')

          (root / 'code-intel/core/src/storage/index-trust.ts').write_text(r'''import fs from 'node:fs';
import path from 'node:path';
import { execFileSync } from 'node:child_process';
import {
  computeIndexVersionForPaths,
  loadMetadata,
  saveMetadata,
  type IndexMetadata,
} from './metadata.js';
import { resolveIndexSnapshot } from './index-snapshot.js';

export type IndexTrustState = 'trusted' | 'stale' | 'corrupt' | 'legacy' | 'missing';

export interface IndexArtifactState {
  path: string;
  required: boolean;
  exists: boolean;
  size: number;
}

export interface IndexTrustResult {
  state: IndexTrustState;
  trusted: boolean;
  fresh: boolean;
  reasons: string[];
  metadata: IndexMetadata | null;
  currentCommit?: string;
  generationId?: string;
  artifacts: {
    graph: IndexArtifactState;
    bm25: IndexArtifactState;
    vector: IndexArtifactState;
  };
}

function artifactState(filePath: string, required: boolean): IndexArtifactState {
  try {
    const stat = fs.statSync(filePath);
    return { path: filePath, required, exists: stat.isFile(), size: stat.size };
  } catch {
    return { path: filePath, required, exists: false, size: 0 };
  }
}

function readMetadata(filePath: string): IndexMetadata | null {
  try { return JSON.parse(fs.readFileSync(filePath, 'utf8')) as IndexMetadata; } catch { return null; }
}

function readCurrentCommit(repoDir: string): string | undefined {
  try {
    return execFileSync('git', ['-C', repoDir, 'rev-parse', 'HEAD'], {
      encoding: 'utf8',
      stdio: ['ignore', 'pipe', 'ignore'],
    }).trim() || undefined;
  } catch {
    return undefined;
  }
}

export function verifyIndexTrust(repoDir: string): IndexTrustResult {
  const snapshot = resolveIndexSnapshot(repoDir);
  const fallbackDir = path.join(path.resolve(repoDir), '.code-intel');
  const paths = snapshot ?? {
    generationId: undefined,
    graphDbPath: path.join(fallbackDir, 'graph.db'),
    bm25DbPath: path.join(fallbackDir, 'bm25.db'),
    vectorDbPath: path.join(fallbackDir, 'vector.db'),
    metadataPath: path.join(fallbackDir, 'meta.json'),
    legacy: true,
  };
  const metadata = readMetadata(paths.metadataPath);
  const vectorRequired = Boolean(metadata?.embeddings?.enabled && metadata.embeddings.status === 'ready');
  const artifacts = {
    graph: artifactState(paths.graphDbPath, true),
    bm25: artifactState(paths.bm25DbPath, true),
    vector: artifactState(paths.vectorDbPath, vectorRequired),
  };
  const reasons: string[] = [];
  const anyArtifact = Object.values(artifacts).some((artifact) => artifact.exists);

  if (!metadata && !anyArtifact) {
    return { state: 'missing', trusted: false, fresh: false, reasons: ['INDEX_NOT_FOUND'], metadata: null, generationId: snapshot?.generationId, artifacts };
  }
  if (!metadata) {
    return { state: 'legacy', trusted: false, fresh: false, reasons: ['METADATA_MISSING'], metadata: null, generationId: snapshot?.generationId, artifacts };
  }

  for (const [name, artifact] of Object.entries(artifacts)) {
    if (artifact.required && !artifact.exists) reasons.push(`${name.toUpperCase()}_ARTIFACT_MISSING`);
    if (artifact.exists && artifact.size === 0) reasons.push(`${name.toUpperCase()}_ARTIFACT_EMPTY`);
  }

  const legacy = paths.legacy || metadata.schemaVersion === undefined || metadata.indexVersion === undefined;
  if (legacy) reasons.push('LEGACY_METADATA');

  if (!legacy && metadata.schemaVersion !== undefined && metadata.indexVersion) {
    const expected = computeIndexVersionForPaths(metadata.schemaVersion, metadata.indexedAt, {
      graphDbPath: paths.graphDbPath,
      bm25DbPath: paths.bm25DbPath,
      vectorDbPath: paths.vectorDbPath,
    });
    if (expected !== metadata.indexVersion) reasons.push('INDEX_FINGERPRINT_MISMATCH');
  }

  if (metadata.generationId && snapshot && !snapshot.legacy && metadata.generationId !== snapshot.generationId) {
    reasons.push('GENERATION_ID_MISMATCH');
  }
  if (metadata.embeddings?.enabled && metadata.embeddings.status === 'stale') reasons.push('EMBEDDINGS_STALE');

  const currentCommit = readCurrentCommit(repoDir);
  const fresh = !metadata.commitHash || !currentCommit || metadata.commitHash === currentCommit;
  if (!fresh) reasons.push('SOURCE_COMMIT_CHANGED');

  const corrupt = reasons.some((reason) =>
    reason.endsWith('_MISSING') || reason.endsWith('_EMPTY')
    || reason === 'INDEX_FINGERPRINT_MISMATCH' || reason === 'GENERATION_ID_MISMATCH',
  );
  const state: IndexTrustState = corrupt
    ? 'corrupt'
    : legacy
      ? 'legacy'
      : reasons.length > 0
        ? 'stale'
        : 'trusted';

  return {
    state,
    trusted: state === 'trusted',
    fresh,
    reasons,
    metadata,
    currentCommit,
    generationId: snapshot?.generationId,
    artifacts,
  };
}

export function upgradeLegacyIndexMetadata(repoDir: string, schemaVersion: number): IndexMetadata {
  const current = loadMetadata(repoDir);
  if (!current) throw new Error(`Cannot upgrade index metadata: ${path.join(repoDir, '.code-intel', 'meta.json')} is missing`);
  const indexedAt = current.indexedAt || new Date().toISOString();
  const snapshot = resolveIndexSnapshot(repoDir);
  const upgraded: IndexMetadata = {
    ...current,
    indexedAt,
    schemaVersion,
    indexVersion: snapshot
      ? computeIndexVersionForPaths(schemaVersion, indexedAt, snapshot)
      : current.indexVersion,
  };
  saveMetadata(repoDir, upgraded);
  return upgraded;
}
''')

