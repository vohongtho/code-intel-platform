      - name: Typecheck core
        run: npm run typecheck --workspace=code-intel/core

      - name: Compile and run Generation V2 tests
        shell: bash
        run: |
          npx tsc -b code-intel/core/tsconfig.test.json
          NODE_ENV=test node --test --test-concurrency=1 \
            code-intel/core/dist-tests/tests/unit/pipeline/analysis-plan.test.js \
            code-intel/core/dist-tests/tests/unit/storage/analyze-lock.test.js \
            code-intel/core/dist-tests/tests/unit/storage/index-snapshot.test.js \
            code-intel/core/dist-tests/tests/unit/storage/generation-v2.test.js \
            code-intel/core/dist-tests/tests/unit/storage/index-generation.test.js

      - name: Build core
        run: npm run build --workspace=code-intel/core

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement generation v2"
          git push origin HEAD:branch/1.0.10
