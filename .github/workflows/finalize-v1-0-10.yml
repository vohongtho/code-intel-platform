name: Finalize v1.0.10

on:
  pull_request:
    branches: [main]
    paths:
      - .github/patches/v1-0-10-finalize-docs/**
      - .github/workflows/finalize-v1-0-10.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final documentation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/v1-0-10-finalize-docs/chunk-* > /tmp/finalize.patch.gz.b64
          base64 -d /tmp/finalize.patch.gz.b64 | gzip -d > /tmp/finalize.patch
          git apply --check /tmp/finalize.patch
          git apply /tmp/finalize.patch
          rm -rf .github/patches/v1-0-10-finalize-docs

      - name: Verify implementation record
        shell: bash
        run: |
          set -euo pipefail
          tasks=(
            openspec/changes/v1-0-10-generation-v2/tasks.md
            openspec/changes/v1-0-10-agent-target-aware-setup/tasks.md
          )
          for file in "${tasks[@]}"; do
            if grep -q -- '- \[ \]' "$file"; then
              echo "Unchecked OpenSpec task remains in $file" >&2
              exit 1
            fi
          done
          grep -q 'Agent-aware Setup' README.md
          grep -q 'Setup does \*\*not\*\* create or modify repository instruction files' README.md
          grep -q 'The release branch is `release/1.0.10`' docs/releases/v1.0.10.md
          grep -q 'Quality workflow passes' openspec/changes/v1-0-10-generation-v2/tasks.md
          grep -q 'No new agent-reconfiguration command or flag exists' openspec/changes/v1-0-10-agent-target-aware-setup/tasks.md

      - name: Delete obsolete branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin branch/1.0.10 >/dev/null 2>&1; then
            git push origin --delete branch/1.0.10
          fi
          if git ls-remote --exit-code --heads origin branch/1.0.10 >/dev/null 2>&1; then
            echo 'Obsolete branch branch/1.0.10 still exists' >&2
            exit 1
          fi

      - name: Commit finalized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize v1.0.10 implementation record"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
