name: Guide Source Verification

on:
  pull_request:
    paths:
      - 'guide/**'
      - 'code-intel/core/src/cli/**'
      - 'code-intel/core/src/mcp-server/**'
      - 'code-intel/core/src/http/**'
      - 'code-intel/core/src/languages/**'
      - 'code-intel/core/package.json'
      - '.github/workflows/guide-source-verify.yml'
  push:
    branches:
      - 'docs/vercel-guide-1.0.9'
    paths:
      - 'guide/**'
      - 'code-intel/core/src/cli/**'
      - 'code-intel/core/src/mcp-server/**'
      - 'code-intel/core/src/http/**'
      - 'code-intel/core/src/languages/**'
      - 'code-intel/core/package.json'
      - '.github/workflows/guide-source-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-audited guide
        run: node guide/verify-guide.mjs
