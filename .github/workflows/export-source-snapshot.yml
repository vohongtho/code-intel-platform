name: Export Source Snapshot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/code-intel-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: code-intel-source
          path: /tmp/code-intel-source.tar.gz
          retention-days: 1
