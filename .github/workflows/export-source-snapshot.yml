name: Export Source Snapshot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/code-intel-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: code-intel-source
          path: /tmp/code-intel-source.tar.gz
          retention-days: 1

  fix-incremental-correctness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply incremental correctness fixes
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('code-intel/core/src/pipeline/incremental.ts')
          s = p.read_text()
          s = s.replace("import { execSync } from 'node:child_process';", "import { execFileSync } from 'node:child_process';")
          s = s.replace("return execSync('git rev-parse HEAD', { cwd: workspaceRoot, encoding: 'utf-8', stdio: ['pipe', 'pipe', 'pipe'] }).trim();", "return execFileSync('git', ['rev-parse', 'HEAD'], { cwd: workspaceRoot, encoding: 'utf-8', stdio: ['pipe', 'pipe', 'pipe'] }).trim();")
          old = '''export function getChangedFilesSince(workspaceRoot: string, baseHash: string): string[] | null {
            try {
              const output = execSync(
                `git diff --name-only ${baseHash} HEAD`,
                { cwd: workspaceRoot, encoding: 'utf-8', stdio: ['pipe', 'pipe', 'pipe'] },
              ).trim();
              if (!output) return [];
              return output.split('\\n').map((f) => f.trim()).filter(Boolean);
            } catch {
              return null;
            }
          }'''
          new = '''export function getChangedFilesSince(workspaceRoot: string, baseHash: string): string[] | null {
            try {
              const tracked = execFileSync('git', ['diff', '--name-only', baseHash, '--'], {
                cwd: workspaceRoot,
                encoding: 'utf-8',
                stdio: ['pipe', 'pipe', 'pipe'],
              });
              const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard'], {
                cwd: workspaceRoot,
                encoding: 'utf-8',
                stdio: ['pipe', 'pipe', 'pipe'],
              });
              return [...new Set(`${tracked}\\n${untracked}`
                .split('\\n')
                .map((file) => file.trim().replace(/\\\\/g, '/').replace(/^\\.\\//, ''))
                .filter(Boolean))]
                .sort();
            } catch {
              return null;
            }
          }'''
          if old not in s:
              raise SystemExit('getChangedFilesSince block not found')
          s = s.replace(old, new)
          s = s.replace("const finalizeIncremental = (changedExistingFiles: string[], source: 'git' | 'mtime'): IncrementalDecision => {", "const finalizeIncremental = (changedExistingFiles: string[], source: 'git' | 'mtime' | 'git+mtime'): IncrementalDecision => {")
          old = '''    if (changed !== null) {
                const changedExistingFiles = changed
                  .filter((rel) => currentRelSet.has(rel))
                  .map((rel) => path.join(workspaceRoot, rel));
                return finalizeIncremental(changedExistingFiles, 'git');
              }'''
          new = '''    if (changed !== null) {
                const changedRelPaths = new Set(changed);
                if (storedMtimes && Object.keys(storedMtimes).length > 0) {
                  for (const absPath of filterChangedByMtime(allFilePaths, workspaceRoot, storedMtimes)) {
                    changedRelPaths.add(path.relative(workspaceRoot, absPath).replace(/\\\\/g, '/'));
                  }
                }
                const changedExistingFiles = [...changedRelPaths]
                  .filter((rel) => currentRelSet.has(rel))
                  .map((rel) => path.join(workspaceRoot, rel));
                return finalizeIncremental(changedExistingFiles, storedMtimes ? 'git+mtime' : 'git');
              }'''
          if old not in s:
              raise SystemExit('git decision block not found')
          p.write_text(s.replace(old, new))

          p = Path('code-intel/core/src/pipeline/incremental-indexer.ts')
          s = p.read_text()
          marker = 'export class IncrementalIndexer {'
          helper = '''export function removeAffectedNodesFromGraph(
            graph: KnowledgeGraph,
            workspaceRoot: string,
            changedFiles: string[],
            deletedFiles: string[] = [],
          ): number {
            const nodesByFilePath = new Map<string, string[]>();
            for (const node of graph.allNodes()) {
              if (!node.filePath) continue;
              const ids = nodesByFilePath.get(node.filePath);
              if (ids) ids.push(node.id);
              else nodesByFilePath.set(node.filePath, [node.id]);
            }
            const affectedRelPaths = new Set<string>(deletedFiles);
            for (const absPath of changedFiles) affectedRelPaths.add(path.relative(workspaceRoot, absPath));
            const nodeIdsToRemove = new Set<string>();
            for (const relPath of affectedRelPaths) {
              for (const id of nodesByFilePath.get(relPath) ?? []) nodeIdsToRemove.add(id);
              const absPath = path.join(workspaceRoot, relPath);
              for (const id of nodesByFilePath.get(absPath) ?? []) nodeIdsToRemove.add(id);
            }
            for (const id of nodeIdsToRemove) graph.removeNodeCascade(id);
            return nodeIdsToRemove.size;
          }

          '''
          if helper.strip() not in s:
              s = s.replace(marker, helper + marker)
          start = s.index('    // ── 1. Remove stale nodes from in-memory graph')
          end = s.index('    // ── 2. Remove stale nodes from DB')
          replacement = '''    // ── 1. Remove stale nodes from in-memory graph ────────────────────────────
              const nodesRemoved = removeAffectedNodesFromGraph(graph, workspaceRoot, changedFiles, deletedFiles);
              const affectedRelPaths = new Set<string>(deletedFiles);
              for (const absPath of changedFiles) affectedRelPaths.add(path.relative(workspaceRoot, absPath));

          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('code-intel/core/src/cli/app.ts')
          s = p.read_text()
          s = s.replace("import { IncrementalIndexer } from '../pipeline/incremental-indexer.js';", "import { removeAffectedNodesFromGraph } from '../pipeline/incremental-indexer.js';")
          old = '''          incrementalChangedFiles = decision.changedExistingFiles ?? [];
                    incrementalDeletedFiles = decision.deletedFiles ?? [];
                    if (!options?.silent) {'''
          new = '''          incrementalChangedFiles = decision.changedExistingFiles ?? [];
                    incrementalDeletedFiles = decision.deletedFiles ?? [];
                    removeAffectedNodesFromGraph(fullIndexGraph, workspaceRoot, incrementalChangedFiles, incrementalDeletedFiles);
                    if (!options?.silent) {'''
          if old not in s:
              raise SystemExit('incremental assignment block not found')
          s = s.replace(old, new)
          block = '''  if (isIncremental && fullIndexGraph && !zeroChangeIncremental) {
              const indexer = new IncrementalIndexer(fullIndexGraph, workspaceRoot, getDbPath(workspaceRoot));
              await indexer.patchGraph(incrementalChangedFiles, incrementalDeletedFiles);
            }

          '''
          if block not in s:
              raise SystemExit('second patchGraph block not found')
          p.write_text(s.replace(block, ''))

          p = Path('code-intel/core/tests/unit/pipeline/incremental.test.ts')
          s = p.read_text()
          addition = r'''

          describe('dirty working tree detection', () => {
            it('detects unstaged, staged and untracked files when baseHash equals HEAD', () => {
              const repo = fs.mkdtempSync(path.join(os.tmpdir(), 'ci-dirty-git-'));
              try {
                execSync('git init -q', { cwd: repo });
                execSync('git config user.email test@example.com', { cwd: repo });
                execSync('git config user.name Test', { cwd: repo });
                fs.writeFileSync(path.join(repo, 'unstaged.ts'), 'export const a = 1;');
                fs.writeFileSync(path.join(repo, 'staged.ts'), 'export const b = 1;');
                execSync('git add . && git commit -qm initial', { cwd: repo });
                const base = getCurrentCommitHash(repo)!;
                fs.writeFileSync(path.join(repo, 'unstaged.ts'), 'export const a = 2;');
                fs.writeFileSync(path.join(repo, 'staged.ts'), 'export const b = 2;');
                execSync('git add staged.ts', { cwd: repo });
                fs.writeFileSync(path.join(repo, 'untracked.ts'), 'export const c = 1;');
                assert.deepEqual(getChangedFilesSince(repo, base), ['staged.ts', 'unstaged.ts', 'untracked.ts']);
              } finally {
                fs.rmSync(repo, { recursive: true, force: true });
              }
            });

            it('unions git and mtime evidence', () => {
              const repo = fs.mkdtempSync(path.join(os.tmpdir(), 'ci-git-mtime-'));
              try {
                execSync('git init -q', { cwd: repo });
                execSync('git config user.email test@example.com', { cwd: repo });
                execSync('git config user.name Test', { cwd: repo });
                const files: string[] = [];
                for (let i = 0; i < 10; i++) {
                  const file = path.join(repo, `file${i}.ts`);
                  fs.writeFileSync(file, `export const v${i} = ${i};`);
                  files.push(file);
                }
                execSync('git add . && git commit -qm initial', { cwd: repo });
                const base = getCurrentCommitHash(repo)!;
                const mtimes = buildMtimeSnapshot(files, repo);
                mtimes['file0.ts'] -= 10_000;
                const result = decideIncremental(repo, files, base, mtimes);
                assert.equal(result.incremental, true);
                assert.deepEqual(result.changedExistingFiles, [files[0]]);
              } finally {
                fs.rmSync(repo, { recursive: true, force: true });
              }
            });
          });
          '''
          if "describe('dirty working tree detection'" not in s:
              s += addition
          p.write_text(s)

          p = Path('code-intel/core/tests/unit/pipeline/incremental-indexer.test.ts')
          s = p.read_text()
          s = s.replace("import { IncrementalIndexer } from '../../../src/pipeline/incremental-indexer.js';", "import { IncrementalIndexer, removeAffectedNodesFromGraph } from '../../../src/pipeline/incremental-indexer.js';")
          addition = r'''

          describe('removeAffectedNodesFromGraph', () => {
            it('removes changed and deleted file nodes before the main pipeline', () => {
              const graph = new KnowledgeGraph();
              graph.addNode({ id: 'a', name: 'a', kind: 'function', filePath: 'src/a.ts' });
              graph.addNode({ id: 'b', name: 'b', kind: 'function', filePath: 'src/b.ts' });
              graph.addEdge({ source: 'a', target: 'b', type: 'calls' });
              const removed = removeAffectedNodesFromGraph(graph, '/repo', ['/repo/src/a.ts'], []);
              assert.equal(removed, 1);
              assert.equal(graph.getNode('a'), undefined);
              assert.ok(graph.getNode('b'));
              assert.equal([...graph.allEdges()].length, 0);
            });
          });
          '''
          if "describe('removeAffectedNodesFromGraph'" not in s:
              s += addition
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --include=optional
          npm rebuild tree-sitter tree-sitter-typescript tree-sitter-javascript tree-sitter-python tree-sitter-java tree-sitter-go tree-sitter-rust tree-sitter-c tree-sitter-cpp tree-sitter-c-sharp tree-sitter-php tree-sitter-ruby tree-sitter-kotlin tree-sitter-swift @ladybugdb/core onnxruntime-node sharp protobufjs || true
          npx tsc -b code-intel/shared code-intel/core
          npm test --workspace=code-intel/core
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add code-intel/core/src/pipeline/incremental.ts code-intel/core/src/pipeline/incremental-indexer.ts code-intel/core/src/cli/app.ts code-intel/core/tests/unit/pipeline/incremental.test.ts code-intel/core/tests/unit/pipeline/incremental-indexer.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(incremental): include dirty tree and parse changed files once'
          git push origin HEAD:release/1.0.8
