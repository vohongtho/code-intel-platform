name: Export Source Snapshot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/code-intel-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: code-intel-source
          path: /tmp/code-intel-source.tar.gz
          retention-days: 1

  sync-v1-0-8-docs:
    if: github.head_ref == 'release/1.0.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8
          fetch-depth: 0
      - name: Patch release documentation
        run: |
          python <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected text not found: {label}')
              return text.replace(old, new, 1)

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('npm-v1.0.4-blue', 'npm-v1.0.8-blue', 1)
          s = one(s, "- **Hybrid Search (BM25 + Vector RRF)** — Reciprocal Rank Fusion of keyword + semantic search; `searchMode: 'bm25' | 'vector' | 'hybrid'` in response", "- **Hybrid Search (BM25 + Vector RRF)** — Reciprocal Rank Fusion with truthful `requestedMode`, `actualMode`, and `searchMode`. Fallback reports `VECTOR_INDEX_UNAVAILABLE` for missing/unbuilt/empty vector state and `VECTOR_QUERY_FAILED` for vector execution errors.", 'README hybrid search')
          s = one(s, '- **Incremental Analysis** — `--incremental` flag re-parses only git-changed/mtime-changed files; 10k-file repo with 3 changes: 288ms', '- **Correctness-First Incremental Analysis** _(v1.0.8)_ — detects committed, staged, unstaged, untracked, mtime-changed, and deleted files. Zero-change runs keep the fast path; any non-empty change set performs a clean full graph rebuild so cross-file `calls`, `imports`, `extends`, `implements`, clusters, and flows cannot be lost.', 'README incremental')
          s = one(s, '> **Upgrade note for v1.0.4:** After upgrading, re-build the local index before comparing results or using `serve`/`status` against old data:', '> **Upgrade note for v1.0.8:** Run a forced analysis once after upgrading to publish the atomic generation layout and refresh all graph-derived relationships:', 'README upgrade')
          s = one(s, '> This refreshes `.code-intel/graph.db` and `.code-intel/meta.json`. Comparing fresh CLI behavior against stale indexes can look like a regression when it is only old index state.', '> This publishes `.code-intel/current.json` plus a trusted generation containing graph, BM25, optional vector data, and metadata. Changed/deleted source sets use a correctness-first full rebuild; only zero-change runs keep the incremental fast path.', 'README upgrade detail')
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          if '## [1.0.8] - 2026-07-31' not in s:
              block = '''## [1.0.8] - 2026-07-31

### 🧭 Correctness-first incremental analysis

- Detects committed, staged, unstaged, untracked, mtime-changed, and deleted paths together.
- Prevents partial incremental publication from losing cross-file `calls`, `imports`, `extends`, `implements`, clusters, flows, or generated metadata.
- Keeps the zero-change fast path; any non-empty changed/deleted set performs a clean full graph rebuild in v1.0.8.
- Adds unchanged caller/importer/inheritor regression coverage and canonical graph equivalence against a forced clean rebuild.

### 🔍 Truthful vector fallback reporting

- Hybrid search records vector status as `unavailable`, `failed`, `empty`, or `success`.
- Missing, unbuilt, or empty vector execution maps to `VECTOR_INDEX_UNAVAILABLE`.
- Vector execution exceptions map to `VECTOR_QUERY_FAILED`.
- Adds fallback contract regression tests.

### 🗃️ Atomic index and release safety

- Adds atomic graph/BM25/vector/metadata generation publication with rollback safety.
- Adds index trust/freshness diagnostics, strict whole-document token budgeting, and Change Context Pack transports.
- Release Readiness validates package metadata, distributable build, npm pack, CLI version, atomic publication, trusted index state, dirty-tree handling, canonical graph equivalence, and security audit.

---

'''
              s = one(s, '---\n\n## [1.0.7]', '---\n\n' + block + '## [1.0.7]', 'CHANGELOG insertion')
          p.write_text(s)

          p = Path('docs/releases/v1.0.8.md')
          s = p.read_text()
          s = s.replace('stable states: `ready`, `stale`, `corrupt`, `missing` or `legacy`', 'stable states: `trusted`, `stale`, `corrupt`, `missing` or `legacy`')
          if '### Correctness-first changed-file handling' not in s:
              section = '''### Correctness-first changed-file handling

v1.0.8 detects committed, staged, unstaged, untracked, mtime-changed, and deleted source paths. Zero-change runs keep the incremental fast path. Any non-empty changed/deleted source set performs a clean full graph rebuild so unchanged callers, importers, and inheritors are re-resolved and generated clusters/flows are recreated from a clean baseline.

This intentionally prioritizes correctness over partial-rebuild latency. Release validation requires canonical graph equivalence with a forced clean rebuild.

'''
              s = one(s, '### Truthful and explainable search\n', section + '### Truthful and explainable search\n', 'release incremental section')
          s = s.replace('- explicit vector fallback reasons;', '- explicit fallback reasons: `VECTOR_INDEX_UNAVAILABLE` for missing/unbuilt/empty vector state and `VECTOR_QUERY_FAILED` for execution errors;', 1)
          s = s.replace('- search explanation and score-evidence tests;', '- search explanation, score-evidence, and vector fallback contract tests;\n- unchanged caller/importer/inheritor regression coverage;\n- canonical changed-run versus forced-rebuild graph equivalence, including cluster and flow state;', 1)
          p.write_text(s)

          p = Path('docs/releases/v1.0.8-go-live-checklist.md')
          s = p.read_text()
          s = one(s, '- [ ] Release Readiness passes package build, npm pack, CLI version, atomic analysis, index trust and security gates.', '- [ ] Release Readiness passes package build, npm pack, CLI version, atomic analysis, index trust, dirty-tree detection, canonical graph equivalence, and security gates.', 'checklist release gate')
          if 'unchanged caller/importer/inheritor' not in s:
              s = one(s, '- [ ] `code-intel/core/package.json` and `package-lock.json` both report `1.0.8` for the core workspace.', '- [ ] `code-intel/core/package.json` and `package-lock.json` both report `1.0.8` for the core workspace.\n- [ ] Regression coverage confirms an unchanged caller/importer/inheritor still connects to a changed target.\n- [ ] Search fallback tests distinguish `VECTOR_INDEX_UNAVAILABLE` from `VECTOR_QUERY_FAILED`.', 'checklist regressions')
          s = one(s, '- Search reports truthful requested and actual modes.', '- Search reports truthful requested and actual modes, with accurate vector fallback reason.\n- Changed/deleted source triggers a correctness-first full graph rebuild; zero-change keeps the fast path.', 'checklist outcomes')
          s = one(s, '- [ ] Verify full and incremental analysis both return `state: "trusted"` with `trusted: true`.', '- [ ] Verify forced and auto analysis return `state: "trusted"` with `trusted: true`.\n- [ ] Verify zero-change uses the fast path and changed/deleted source uses a clean full rebuild.\n- [ ] Verify calls, imports, extends/implements, clusters, and flows match a forced clean rebuild after changing a shared target.', 'checklist post-deployment')
          p.write_text(s)
          PY
          grep -q '## \[1.0.8\] - 2026-07-31' CHANGELOG.md
          grep -q 'Correctness-First Incremental Analysis' README.md
          grep -q 'VECTOR_QUERY_FAILED' docs/releases/v1.0.8.md
          grep -q 'unchanged caller/importer/inheritor' docs/releases/v1.0.8-go-live-checklist.md
      - name: Commit release documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md docs/releases/v1.0.8.md docs/releases/v1.0.8-go-live-checklist.md
          git commit -m 'docs: complete v1.0.8 release documentation'
          git push origin HEAD:release/1.0.8
