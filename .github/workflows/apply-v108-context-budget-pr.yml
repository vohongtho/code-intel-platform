name: Apply v1.0.8 Context Budget

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-v108-context-budget-pr.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          cat > code-intel/core/src/context/budget.ts <<'EOF'
          import { estimateTokens, type BlockTokens } from './token-counter.js';

          export const MIN_CONTEXT_TOKENS = 128;
          export const MAX_CONTEXT_TOKENS = 6000;
          export const DEFAULT_CONTEXT_TOKENS = 6000;

          export type ContextBlockName = 'summary' | 'logic' | 'relation' | 'focusCode';

          export class ContextBudgetValidationError extends Error {
            readonly code = 'INVALID_CONTEXT_TOKEN_BUDGET';
            constructor(message: string) {
              super(message);
              this.name = 'ContextBudgetValidationError';
            }
          }

          export function normalizeContextTokenBudget(
            value: unknown,
            options: { strict?: boolean; defaultValue?: number } = {},
          ): number {
            const fallback = options.defaultValue ?? DEFAULT_CONTEXT_TOKENS;
            if (value === undefined || value === null) return fallback;
            if (typeof value !== 'number' || !Number.isFinite(value) || !Number.isInteger(value)) {
              if (options.strict) throw new ContextBudgetValidationError('maxTokens must be a finite integer');
              return fallback;
            }
            if (value < MIN_CONTEXT_TOKENS || value > MAX_CONTEXT_TOKENS) {
              if (options.strict) {
                throw new ContextBudgetValidationError(
                  `maxTokens must be between ${MIN_CONTEXT_TOKENS} and ${MAX_CONTEXT_TOKENS}`,
                );
              }
              return Math.max(MIN_CONTEXT_TOKENS, Math.min(MAX_CONTEXT_TOKENS, value));
            }
            return value;
          }

          export function trimTextToTokenBudget(
            text: string,
            maxTokens: number,
          ): { text: string; truncated: boolean } {
            if (!text || estimateTokens(text) <= maxTokens) return { text, truncated: false };
            if (maxTokens <= 0) return { text: '', truncated: true };
            const marker = '\n… [truncated]';
            if (estimateTokens(marker) >= maxTokens) return { text: '', truncated: true };
            let low = 0;
            let high = text.length;
            let best = '';
            while (low <= high) {
              const middle = Math.floor((low + high) / 2);
              const candidate = text.slice(0, middle).replace(/[\s\n]+$/u, '') + marker;
              if (estimateTokens(candidate) <= maxTokens) {
                best = candidate;
                low = middle + 1;
              } else {
                high = middle - 1;
              }
            }
            return { text: best, truncated: true };
          }

          export function measureContextBlocks(blocks: Record<ContextBlockName, string>): BlockTokens {
            const summary = estimateTokens(blocks.summary);
            const logic = estimateTokens(blocks.logic);
            const relation = estimateTokens(blocks.relation);
            const focusCode = estimateTokens(blocks.focusCode);
            return { summary, logic, relation, focusCode, total: summary + logic + relation + focusCode };
          }

          export function enforceContextBudget(
            blocks: Record<ContextBlockName, string>,
            maxTokens: number,
            order: ContextBlockName[] = ['focusCode', 'relation', 'logic', 'summary'],
          ): { blocks: Record<ContextBlockName, string>; blockTokens: BlockTokens; truncatedBlocks: ContextBlockName[] } {
            const result = { ...blocks };
            const truncated = new Set<ContextBlockName>();
            let measured = measureContextBlocks(result);
            for (const block of order) {
              if (measured.total <= maxTokens) break;
              const allowance = Math.max(0, maxTokens - (measured.total - measured[block]));
              const trimmed = trimTextToTokenBudget(result[block], allowance);
              result[block] = trimmed.text;
              if (trimmed.truncated) truncated.add(block);
              measured = measureContextBlocks(result);
            }
            for (const block of [...order].reverse()) {
              while (result[block] && measured.total > maxTokens) {
                result[block] = result[block].slice(0, -8).replace(/[\s\n]+$/u, '');
                truncated.add(block);
                measured = measureContextBlocks(result);
              }
            }
            return { blocks: result, blockTokens: measured, truncatedBlocks: [...truncated].sort() };
          }
          EOF

          python <<'PY'
          from pathlib import Path
          p = Path('code-intel/core/src/context/builder.ts')
          s = p.read_text()
          s = s.replace(
              "import { estimateTokens } from './token-counter.js';",
              "import { estimateTokens } from './token-counter.js';\nimport { enforceContextBudget, normalizeContextTokenBudget, trimTextToTokenBudget, type ContextBlockName } from './budget.js';",
          )
          s = s.replace(
          """  /** True if FOCUS CODE was trimmed due to budget exhaustion. */
            truncated: boolean;
            /** Detected or user-supplied intent (for observability). */
            intent: QueryIntent;
            /** Per-block token counts (filled by measureBlocks). */
            blockTokens?: { summary: number; logic: number; relation: number; focusCode: number; total: number };""",
          """  /** True when any block was shortened or omitted. */
            truncated: boolean;
            /** Detected or user-supplied intent (for observability). */
            intent: QueryIntent;
            /** Normalized hard limit applied to the complete document. */
            maxTokens?: number;
            /** Per-block token counts after all trimming. */
            blockTokens?: { summary: number; logic: number; relation: number; focusCode: number; total: number };
            /** Stable block names whose content was shortened or omitted. */
            truncatedBlocks?: ContextBlockName[];""",
          )
          start = s.index('export function build(')
          build = """export function build(
            seeds: SeedSymbol[],
            graph: KnowledgeGraph,
            options: BuilderOptions = {},
          ): ContextDocument {
            const maxTokens = normalizeContextTokenBudget(options.maxTokens);
            const signatureOnlyThreshold = options.signatureOnlyThreshold ?? 0.3;
            const intent: QueryIntent = options.queryIntent ?? 'auto';
            const preset = BUDGET_PRESETS[intent];
            const nodes = seeds.map((seed) => graph.getNode(seed.nodeId)).filter((node): node is CodeNode => node !== undefined);
            const dedup = new DedupeRegistry();
            const truncatedBlocks = new Set<ContextBlockName>();
            let available = maxTokens;
            const presetTotal = preset.summary + preset.logic + preset.relation + preset.focusCode;
            const scale = Math.min(1, maxTokens / presetTotal);

            const summaryFit = trimTextToTokenBudget(buildSummaryBlock(nodes, graph, dedup), Math.min(available, Math.floor(preset.summary * scale)));
            if (summaryFit.truncated) truncatedBlocks.add('summary');
            available -= estimateTokens(summaryFit.text);

            const logicFit = trimTextToTokenBudget(buildLogicBlock(nodes, graph, dedup), Math.min(available, Math.floor(preset.logic * scale)));
            if (logicFit.truncated) truncatedBlocks.add('logic');
            available -= estimateTokens(logicFit.text);

            const relationFit = trimTextToTokenBudget(buildRelationBlock(nodes, graph, dedup), Math.min(available, Math.floor(preset.relation * scale)));
            if (relationFit.truncated) truncatedBlocks.add('relation');
            available -= estimateTokens(relationFit.text);

            const focus = buildFocusCodeBlock(seeds, nodes, dedup, signatureOnlyThreshold, Math.max(0, available));
            if (focus.truncated) truncatedBlocks.add('focusCode');
            const enforced = enforceContextBudget({
              summary: summaryFit.text,
              logic: logicFit.text,
              relation: relationFit.text,
              focusCode: focus.text,
            }, maxTokens);
            for (const block of enforced.truncatedBlocks) truncatedBlocks.add(block);
            return {
              ...enforced.blocks,
              truncated: truncatedBlocks.size > 0,
              intent,
              maxTokens,
              blockTokens: enforced.blockTokens,
              truncatedBlocks: [...truncatedBlocks].sort(),
            };
          }
          """
          p.write_text(s[:start] + build)

          test = Path('code-intel/core/tests/unit/context/builder.test.ts')
          t = test.read_text().replace(
              "assert.ok(counts.total <= 2200, `total ${counts.total} should be close to 2000 budget`);",
              "assert.ok(counts.total <= 2000, `total ${counts.total} must not exceed 2000 budget`);\n    assert.equal(doc.blockTokens?.total, counts.total);\n    assert.equal(doc.maxTokens, 2000);",
          )
          test.write_text(t)
          PY

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --include=optional

      - name: Rebuild native modules
        run: npm rebuild tree-sitter tree-sitter-typescript tree-sitter-javascript tree-sitter-python tree-sitter-java tree-sitter-go tree-sitter-rust tree-sitter-c tree-sitter-cpp tree-sitter-c-sharp tree-sitter-php tree-sitter-ruby tree-sitter-kotlin tree-sitter-swift better-sqlite3 @ladybugdb/core onnxruntime-node sharp protobufjs || true

      - name: Verify
        run: |
          npx tsc -b code-intel/shared code-intel/core
          npm test --workspace=code-intel/core

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add code-intel/core/src/context/budget.ts code-intel/core/src/context/builder.ts code-intel/core/tests/unit/context/builder.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(context): enforce hard whole-document token budget"
          git push origin HEAD:release/1.0.8
