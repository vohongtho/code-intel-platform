name: Apply v1.0.8 Context Budget

on:
  push:
    branches: [release/1.0.8]
    paths:
      - .github/workflows/apply-v108-context-budget.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hard context budget patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          builder = Path('code-intel/core/src/context/builder.ts')
          source = builder.read_text()
          old_interface = """export interface ContextDocument {
            summary: string;
            logic: string;
            relation: string;
            focusCode: string;
            /** True if FOCUS CODE was trimmed due to budget exhaustion. */
            truncated: boolean;
            /** Detected or user-supplied intent (for observability). */
            intent: QueryIntent;
            /** Per-block token counts (filled by measureBlocks). */
            blockTokens?: { summary: number; logic: number; relation: number; focusCode: number; total: number };
          }"""
          new_interface = """export type ContextBlockName = 'summary' | 'logic' | 'relation' | 'focusCode';

          export interface ContextDocument {
            summary: string;
            logic: string;
            relation: string;
            focusCode: string;
            /** Normalized hard limit for the complete document. */
            maxTokens?: number;
            /** True when any block was shortened or omitted to satisfy maxTokens. */
            truncated: boolean;
            /** Blocks shortened or omitted to satisfy maxTokens. */
            truncatedBlocks?: ContextBlockName[];
            /** Detected or user-supplied intent (for observability). */
            intent: QueryIntent;
            /** Per-block token counts measured from the returned strings. */
            blockTokens?: { summary: number; logic: number; relation: number; focusCode: number; total: number };
          }"""
          if old_interface not in source:
              raise SystemExit('ContextDocument anchor not found')
          source = source.replace(old_interface, new_interface)

          helper_anchor = '// ── DedupeRegistry (B.6) ──────────────────────────────────────────────────────\n'
          helpers = """/** Fit text to an actual token budget. */
          function fitTextToTokenBudget(text: string, tokenBudget: number): { text: string; truncated: boolean } {
            if (!text || tokenBudget <= 0) return { text: '', truncated: Boolean(text) };
            if (estimateTokens(text) <= tokenBudget) return { text, truncated: false };

            let low = 0;
            let high = text.length;
            while (low < high) {
              const mid = Math.ceil((low + high) / 2);
              if (estimateTokens(text.slice(0, mid)) <= tokenBudget) low = mid;
              else high = mid - 1;
            }

            let fitted = text.slice(0, low).trimEnd();
            while (fitted && estimateTokens(fitted) > tokenBudget) {
              fitted = fitted.slice(0, -1).trimEnd();
            }
            return { text: fitted, truncated: true };
          }

          function blockTokenCounts(summary: string, logic: string, relation: string, focusCode: string) {
            const counts = {
              summary: estimateTokens(summary),
              logic: estimateTokens(logic),
              relation: estimateTokens(relation),
              focusCode: estimateTokens(focusCode),
              total: 0,
            };
            counts.total = counts.summary + counts.logic + counts.relation + counts.focusCode;
            return counts;
          }

          """
          if helper_anchor not in source:
              raise SystemExit('Helper anchor not found')
          source = source.replace(helper_anchor, helpers + helper_anchor)

          build_start = source.index('export function build(')
          new_build = """export function build(
            seeds: SeedSymbol[],
            graph: KnowledgeGraph,
            options: BuilderOptions = {},
          ): ContextDocument {
            const rawMaxTokens = options.maxTokens ?? 6000;
            const maxTokens = Number.isFinite(rawMaxTokens) ? Math.max(1, Math.floor(rawMaxTokens)) : 6000;
            const signatureOnlyThreshold = options.signatureOnlyThreshold ?? 0.3;
            const intent: QueryIntent = options.queryIntent ?? 'auto';
            const budgets = BUDGET_PRESETS[intent];
            const nodes = seeds
              .map((seed) => graph.getNode(seed.nodeId))
              .filter((node): node is CodeNode => node !== undefined);
            const dedup = new DedupeRegistry();
            const truncatedBlocks: ContextBlockName[] = [];
            let available = maxTokens;

            const summaryResult = fitTextToTokenBudget(
              buildSummaryBlock(nodes, graph, dedup),
              Math.min(budgets.summary, available),
            );
            const summary = summaryResult.text;
            available -= estimateTokens(summary);
            if (summaryResult.truncated) truncatedBlocks.push('summary');

            const logicResult = fitTextToTokenBudget(
              buildLogicBlock(nodes, graph, dedup),
              Math.min(budgets.logic, Math.max(0, Math.floor(available * 0.35))),
            );
            const logic = logicResult.text;
            available -= estimateTokens(logic);
            if (logicResult.truncated) truncatedBlocks.push('logic');

            const relationResult = fitTextToTokenBudget(
              buildRelationBlock(nodes, graph, dedup),
              Math.min(budgets.relation, Math.max(0, Math.floor(available * 0.35))),
            );
            const relation = relationResult.text;
            available -= estimateTokens(relation);
            if (relationResult.truncated) truncatedBlocks.push('relation');

            const focusResult = buildFocusCodeBlock(
              seeds,
              nodes,
              dedup,
              signatureOnlyThreshold,
              Math.max(0, available),
            );
            const boundedFocus = fitTextToTokenBudget(focusResult.text, Math.max(0, available));
            const focusCode = boundedFocus.text;
            if (focusResult.truncated || boundedFocus.truncated) truncatedBlocks.push('focusCode');

            const blockTokens = blockTokenCounts(summary, logic, relation, focusCode);
            return {
              summary,
              logic,
              relation,
              focusCode,
              maxTokens,
              truncated: truncatedBlocks.length > 0,
              truncatedBlocks: [...new Set(truncatedBlocks)],
              intent,
              blockTokens,
            };
          }
          """
          source = source[:build_start] + new_build
          builder.write_text(source)

          tests = Path('code-intel/core/tests/unit/context/builder.test.ts')
          test_source = tests.read_text()
          test_source = test_source.replace(
              "assert.ok(counts.total <= 2200, `total ${counts.total} should be close to 2000 budget`);",
              "assert.ok(counts.total <= 2000, `total ${counts.total} must not exceed 2000 budget`);\n    assert.equal(doc.blockTokens?.total, counts.total);\n    assert.equal(doc.maxTokens, 2000);",
          )
          anchor = "  it('B.5.2: intent=code → focusCode gets large budget', () => {"
          extra = """  it('B.5.1: very small budgets remain hard limits and report truncated blocks', () => {
            const g = createKnowledgeGraph();
            for (let i = 0; i < 10; i++) {
              addNode(g, `n${i}`, `LongSymbol${i}`, 'function', `src/feature/file${i}.ts`,
                Array.from({ length: 20 }, (_, j) => `const value${j} = compute(${j});`).join('\\n'),
                i + 1,
                'A deliberately long summary used to exercise deterministic hard-budget trimming.');
            }
            const doc = build(Array.from({ length: 10 }, (_, i) => ({ nodeId: `n${i}` })), g, { maxTokens: 128 });
            assert.ok((doc.blockTokens?.total ?? Infinity) <= 128, `total ${doc.blockTokens?.total} must not exceed 128`);
            assert.equal(doc.maxTokens, 128);
            assert.equal(doc.truncated, true);
            assert.ok((doc.truncatedBlocks?.length ?? 0) > 0);
          });

          """
          if anchor not in test_source:
              raise SystemExit('Test anchor not found')
          tests.write_text(test_source.replace(anchor, extra + anchor))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=code-intel/core

      - name: Run focused context tests
        run: |
          npx tsc -b code-intel/core/tsconfig.test.json
          NODE_ENV=test node --test --test-concurrency=1 code-intel/core/dist-tests/tests/unit/context/builder.test.js code-intel/core/dist-tests/tests/unit/context/token-counter.test.js

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add code-intel/core/src/context/builder.ts code-intel/core/tests/unit/context/builder.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(context): enforce hard token budget"
          git push origin HEAD:release/1.0.8
