name: Apply Generation V2 maintenance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/patches/v1-0-10-maintenance.patch.gz.b64
      - .github/workflows/apply-generation-maintenance.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply maintenance patch
        shell: bash
        run: |
          base64 -d .github/patches/v1-0-10-maintenance.patch.gz.b64 | gzip -d > /tmp/maintenance.patch
          git apply --check /tmp/maintenance.patch
          git apply /tmp/maintenance.patch
          rm .github/patches/v1-0-10-maintenance.patch.gz.b64
          rm .github/workflows/apply-generation-maintenance.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck core
        run: npm run typecheck --workspace=code-intel/core

      - name: Compile tests
        run: npx tsc -b code-intel/core/tsconfig.test.json

      - name: Run maintenance tests
        shell: bash
        run: |
          NODE_ENV=test node --test --test-concurrency=1 \
            code-intel/core/dist-tests/tests/unit/storage/index-maintenance.test.js \
            code-intel/core/dist-tests/tests/unit/storage/analyze-lock.test.js \
            code-intel/core/dist-tests/tests/unit/storage/generation-v2.test.js \
            code-intel/core/dist-tests/tests/unit/cli/config-manager.test.js

      - name: Build core
        run: npm run build --workspace=code-intel/core

      - name: Maintenance CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/code-intel/core/dist/cli/main.js"
          repo="$(mktemp -d)"
          mkdir -p "$repo/src"
          printf 'export const value = 1;\n' > "$repo/src/value.ts"
          git -C "$repo" init -q
          git -C "$repo" config user.email test@example.com
          git -C "$repo" config user.name Test
          git -C "$repo" add .
          git -C "$repo" commit -qm initial
          node "$cli" analyze --skip-embeddings "$repo"
          node "$cli" index cleanup "$repo" --dry-run --keep 1 > "$repo/cleanup.json"
          node --input-type=module - "$repo/cleanup.json" <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result.dryRun !== true || result.keepGenerations !== 1) throw new Error('Unexpected cleanup dry-run');
          NODE
          test ! -e "$repo/.code-intel/analyze.lock"
          node "$cli" index unlock "$repo" > "$repo/unlock.json"

      - name: Commit validated maintenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Generation V2 maintenance commands"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
