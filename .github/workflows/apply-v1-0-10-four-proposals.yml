name: Apply v1.0.10 four proposals

# Atomic implementation staging validation.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-v1-0-10-four-proposals.yml

concurrency:
  group: v1-0-10-four-proposals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail

          echo 'b99571327996689d6d5c8f1649f5b7e8dcbe0962399f1e449c6b8754cfac55ce  .github/patches/v1-0-10-four-proposals.part00' | sha256sum -c -
          echo 'e75574e96674162fb6da7f6dbfc41c38e7d07b7d69897e8019583fff249d94fb  .github/patches/v1-0-10-four-proposals.part01' | sha256sum -c -
          echo 'bbd397c2a04e8b8d258c261e9c6378d09ed3aecfb46d3c994ca1cec35c09b5aa  .github/patches/v1-0-10-four-proposals.part02' | sha256sum -c -
          echo 'b5c45a967d6c3a52bfb476d5680a2715e30bcc28ea9f76b9faf2c1ac21ea4723  .github/patches/v1-0-10-four-proposals.part03' | sha256sum -c -

          head -c 7000 .github/patches/v1-0-10-four-proposals.part04 > /tmp/part04
          echo 'b243ffb405ed366e4c89326218f0b8321f5d8f44ed4c93b438fd0eaebfeead68  /tmp/part04' | sha256sum -c -
          echo 'f4379ab98e36e546fe6b3c4f25cdaf6d75f1978ba765c05c2e4cd0bf3484fade  .github/patches/v1-0-10-four-proposals.part05a' | sha256sum -c -
          echo 'f6571a49b1f9dc407cf3610d88fa04ca628388ff0b257d5f668393ed9eef8208  .github/patches/v1-0-10-four-proposals.part06a' | sha256sum -c -

          echo '365f02de5530b58c107f19323378fb1d126b8479dd18ee53789741e662b39c4e  .github/patches/v1-0-10-four-proposals.part05' | sha256sum -c -
          head -c 7000 .github/patches/v1-0-10-four-proposals.part05 > /tmp/part07
          tail -c +7001 .github/patches/v1-0-10-four-proposals.part05 > /tmp/part08
          echo '6eaf059ae71a003ab08cc66206a1a28387387c7e339285a5b0b4d5ab5bb4f4ee  /tmp/part07' | sha256sum -c -
          echo '22f8ca96a83fb342cb501a6c2aff6deda47a3e466309daf5a2ab49bf8e446d6a  /tmp/part08' | sha256sum -c -

          cat \
            .github/patches/v1-0-10-four-proposals.part00 \
            .github/patches/v1-0-10-four-proposals.part01 \
            .github/patches/v1-0-10-four-proposals.part02 \
            .github/patches/v1-0-10-four-proposals.part03 \
            /tmp/part04 \
            .github/patches/v1-0-10-four-proposals.part05a \
            .github/patches/v1-0-10-four-proposals.part06a \
            /tmp/part07 \
            /tmp/part08 > /tmp/four-proposals.patch.gz.b64

          echo 'a9b447dac33314606494e5e5c6b7798c095b2f5d06c9652e966afabe495e1b61  /tmp/four-proposals.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/four-proposals.patch.gz.b64 | gzip -d > /tmp/four-proposals.patch
          echo '86beebab9c4bd0081f828a94976bd1f447b2b0d139338c248d096c2b26e39220  /tmp/four-proposals.patch' | sha256sum -c -
          git apply --check /tmp/four-proposals.patch
          git apply /tmp/four-proposals.patch

          rm \
            .github/patches/v1-0-10-four-proposals.part00 \
            .github/patches/v1-0-10-four-proposals.part01 \
            .github/patches/v1-0-10-four-proposals.part02 \
            .github/patches/v1-0-10-four-proposals.part03 \
            .github/patches/v1-0-10-four-proposals.part04 \
            .github/patches/v1-0-10-four-proposals.part05 \
            .github/patches/v1-0-10-four-proposals.part05a \
            .github/patches/v1-0-10-four-proposals.part06a \
            .github/workflows/apply-v1-0-10-four-proposals.yml

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --include=optional

      - name: Rebuild required native modules
        run: npm rebuild tree-sitter tree-sitter-typescript tree-sitter-javascript tree-sitter-python tree-sitter-java tree-sitter-go tree-sitter-rust tree-sitter-c tree-sitter-cpp tree-sitter-c-sharp tree-sitter-php tree-sitter-ruby tree-sitter-kotlin tree-sitter-swift @ladybugdb/core onnxruntime-node sharp protobufjs || true

      - name: Typecheck core
        run: npm run typecheck --workspace=code-intel/core

      - name: Test Web UI changes
        run: npm test --workspace=code-intel/web -- --run

      - name: Build Web UI
        run: npm run build --workspace=code-intel/web

      - name: Compile core tests
        run: npx tsc -b code-intel/core/tsconfig.test.json

      - name: Run targeted core regressions
        shell: bash
        run: |
          NODE_ENV=test node --test --test-concurrency=1 \
            code-intel/core/dist-tests/tests/unit/search/embedding-model-registry.test.js \
            code-intel/core/dist-tests/tests/unit/search/vector-index.test.js \
            code-intel/core/dist-tests/tests/unit/auth/session-store.test.js \
            code-intel/core/dist-tests/tests/integration/http/persistent-session-restart.test.js \
            code-intel/core/dist-tests/tests/unit/storage/repository-management.test.js \
            code-intel/core/dist-tests/tests/unit/multi-repo/group-management.test.js \
            code-intel/core/dist-tests/tests/integration/http/management-api.test.js

      - name: Build core
        run: npm run build --workspace=code-intel/core

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement embedding, sessions, and repo management"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
