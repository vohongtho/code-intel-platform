name: Release Validate

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read
  attestations: write
  security-events: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --include=optional

      - name: Rebuild native modules for tests
        run: npm rebuild @ladybugdb/core better-sqlite3 @huggingface/transformers --legacy-peer-deps

      - name: Typecheck (shared + core + web)
        run: npx tsc -b code-intel/shared code-intel/core code-intel/web

      - name: Unit tests
        run: npm test --workspace=code-intel/core

      - name: Build core dist
        run: npm run build --workspace=code-intel/core

      - name: Install cross-platform native packages for runtime bundling
        run: |
          set -euo pipefail
          LADYBUG_VERSION=$(node -p "require('./node_modules/@ladybugdb/core/package.json').version")
          # @ladybugdb/core-<platform>-<arch> are optionalDependencies gated by os/cpu,
          # so `npm ci` only installs the variant matching the runner (linux-x64).
          # `npm install --os --cpu` reconciles the whole tree to one platform and prunes
          # the others, so fetch each remaining variant's tarball directly instead.
          for variant in linux-arm64 darwin-x64 darwin-arm64; do
            workdir=$(mktemp -d)
            tarball=$(npm pack "@ladybugdb/core-${variant}@${LADYBUG_VERSION}" --pack-destination "$workdir" 2>/dev/null)
            tar -xzf "$workdir/$tarball" -C "$workdir"
            mkdir -p "node_modules/@ladybugdb/core-${variant}"
            cp -r "$workdir/package/." "node_modules/@ladybugdb/core-${variant}/"
            rm -rf "$workdir"
          done

      - name: Build self-contained runtime artifacts
        run: |
          node scripts/distribution/build-runtime-bundle.mjs --target linux-x64 --out-dir dist/runtime-bundles
          node scripts/distribution/build-runtime-bundle.mjs --target linux-arm64 --out-dir dist/runtime-bundles
          node scripts/distribution/build-runtime-bundle.mjs --target darwin-x64 --out-dir dist/runtime-bundles
          node scripts/distribution/build-runtime-bundle.mjs --target darwin-arm64 --out-dir dist/runtime-bundles

      - name: Verify runtime artifact sidecars
        run: |
          test -n "$(ls dist/runtime-bundles/*.sha256)"
          test -n "$(ls dist/runtime-bundles/*.sbom.cdx.json)"
          test -n "$(ls dist/runtime-bundles/*.provenance.json)"

      - name: Validate packaged dist layout
        run: npm run validate:dist --workspace=code-intel/core

      - name: Verify runtime distribution flow
        run: npm run verify:runtime-distribution

      - name: npm audit — 0 high/critical CVEs (production deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: License audit — no GPL-incompatible deps
        run: |
          npx --yes license-checker \
            --production \
            --excludePrivatePackages \
            --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;CPAL-1.0" \
          || (echo "❌ GPL-incompatible license detected — review output above." && exit 1)

  build-docker:
    name: Build Docker
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: production
          tags: code-intel:release-validate
          outputs: type=docker,dest=/tmp/code-intel-release-validate.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: code-intel-release-validate-image
          path: /tmp/code-intel-release-validate.tar
          if-no-files-found: error

  scan-image:
    name: Trivy Image Scan
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image archive
        uses: actions/download-artifact@v4
        with:
          name: code-intel-release-validate-image
          path: /tmp

      - name: Trivy — SARIF report (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          input: '/tmp/code-intel-release-validate.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy — gate on CRITICAL CVEs
        uses: aquasecurity/trivy-action@master
        with:
          input: '/tmp/code-intel-release-validate.tar'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '1'
