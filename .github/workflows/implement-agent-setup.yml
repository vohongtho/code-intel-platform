name: Implement agent-aware setup

on:
  push:
    branches:
      - branch/1.0.10
    paths:
      - .github/workflows/implement-agent-setup.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch/1.0.10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          agent_targets = root / 'code-intel/core/src/cli/agent-targets.ts'
          text = agent_targets.read_text()
          text = text.replace(
              "export interface AgentOption {\n  id: string;\n  label: string;\n  builtinTarget?: AgentTargetConfig;\n}",
              "export type AgentSetupIntegrationId =\n  | 'claude-hook'\n  | 'cursor-hook'\n  | 'gemini-hook'\n  | 'opencode-plugin';\n\nexport interface AgentOption {\n  id: string;\n  label: string;\n  builtinTarget?: AgentTargetConfig;\n  setupIntegrations?: AgentSetupIntegrationId[];\n}",
          )
          replacements = {
              "{ id: 'claude', label: 'Claude Code', builtinTarget: { agentId: 'claude', label: 'Claude Code', path: 'CLAUDE.md', format: 'markdown', builtin: true } },":
              "{ id: 'claude', label: 'Claude Code', builtinTarget: { agentId: 'claude', label: 'Claude Code', path: 'CLAUDE.md', format: 'markdown', builtin: true }, setupIntegrations: ['claude-hook'] },",
              "{ id: 'cursor', label: 'Cursor', builtinTarget: { agentId: 'cursor', label: 'Cursor', path: '.cursor/rules/code-intel.mdc', format: 'markdown', builtin: true } },":
              "{ id: 'cursor', label: 'Cursor', builtinTarget: { agentId: 'cursor', label: 'Cursor', path: '.cursor/rules/code-intel.mdc', format: 'markdown', builtin: true }, setupIntegrations: ['cursor-hook'] },",
              "{ id: 'gemini-cli', label: 'Gemini CLI' },":
              "{ id: 'gemini-cli', label: 'Gemini CLI', setupIntegrations: ['gemini-hook'] },",
              "{ id: 'opencode', label: 'OpenCode' },":
              "{ id: 'opencode', label: 'OpenCode', setupIntegrations: ['opencode-plugin'] },",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing agent-targets pattern: {old}')
              text = text.replace(old, new)
          agent_targets.write_text(text)

          setup_plan = root / 'code-intel/core/src/cli/setup-plan.ts'
          setup_plan.write_text(r'''import fs from 'node:fs';
import path from 'node:path';
import {
  AGENT_OPTIONS,
  type AgentSetupIntegrationId,
} from './agent-targets.js';
import type { AgentTargetSelection } from '../storage/metadata.js';

export type SetupSelectionStatus = 'valid' | 'missing' | 'invalid' | 'all-agents';

export interface SetupPlan {
  repositoryRoot: string;
  selectionPath: string;
  selectionStatus: SetupSelectionStatus;
  selectedAgents: string[];
  unknownAgents: string[];
  integrations: AgentSetupIntegrationId[];
  reason?: string;
}

function unique<T>(values: T[]): T[] {
  return [...new Set(values)];
}

function validateSelection(value: unknown): AgentTargetSelection | null {
  if (!value || typeof value !== 'object') return null;
  const candidate = value as Partial<AgentTargetSelection>;
  if (!Array.isArray(candidate.selectedAgents)) return null;
  if (!candidate.targets || typeof candidate.targets !== 'object' || Array.isArray(candidate.targets)) return null;
  if (!candidate.selectedAgents.every((agentId) => typeof agentId === 'string' && agentId.trim().length > 0)) {
    return null;
  }
  return candidate as AgentTargetSelection;
}

function integrationsForAgents(agentIds: string[]): {
  integrations: AgentSetupIntegrationId[];
  unknownAgents: string[];
} {
  const optionsById = new Map(AGENT_OPTIONS.map((option) => [option.id, option]));
  const unknownAgents: string[] = [];
  const integrations: AgentSetupIntegrationId[] = [];
  for (const agentId of agentIds) {
    const option = optionsById.get(agentId);
    if (!option) {
      unknownAgents.push(agentId);
      continue;
    }
    integrations.push(...(option.setupIntegrations ?? []));
  }
  return {
    integrations: unique(integrations),
    unknownAgents: unique(unknownAgents),
  };
}

export function resolveSetupPlan(
  repositoryPath: string,
  options: { allAgents?: boolean } = {},
): SetupPlan {
  const repositoryRoot = path.resolve(repositoryPath);
  const selectionPath = path.join(repositoryRoot, '.code-intel', 'agent-targets.json');

  if (!fs.existsSync(repositoryRoot) || !fs.statSync(repositoryRoot).isDirectory()) {
    return {
      repositoryRoot,
      selectionPath,
      selectionStatus: 'invalid',
      selectedAgents: [],
      unknownAgents: [],
      integrations: [],
      reason: 'Repository path does not exist or is not a directory',
    };
  }

  if (options.allAgents) {
    const selectedAgents = AGENT_OPTIONS
      .filter((option) => (option.setupIntegrations?.length ?? 0) > 0)
      .map((option) => option.id);
    const resolved = integrationsForAgents(selectedAgents);
    return {
      repositoryRoot,
      selectionPath,
      selectionStatus: 'all-agents',
      selectedAgents,
      unknownAgents: [],
      integrations: resolved.integrations,
    };
  }

  if (!fs.existsSync(selectionPath)) {
    return {
      repositoryRoot,
      selectionPath,
      selectionStatus: 'missing',
      selectedAgents: [],
      unknownAgents: [],
      integrations: [],
      reason: 'No saved repository agent selection',
    };
  }

  try {
    const parsed = validateSelection(JSON.parse(fs.readFileSync(selectionPath, 'utf8')) as unknown);
    if (!parsed) {
      return {
        repositoryRoot,
        selectionPath,
        selectionStatus: 'invalid',
        selectedAgents: [],
        unknownAgents: [],
        integrations: [],
        reason: 'agent-targets.json does not match the expected schema',
      };
    }
    const selectedAgents = unique(parsed.selectedAgents);
    const resolved = integrationsForAgents(selectedAgents);
    return {
      repositoryRoot,
      selectionPath,
      selectionStatus: 'valid',
      selectedAgents,
      unknownAgents: resolved.unknownAgents,
      integrations: resolved.integrations,
    };
  } catch (error) {
    return {
      repositoryRoot,
      selectionPath,
      selectionStatus: 'invalid',
      selectedAgents: [],
      unknownAgents: [],
      integrations: [],
      reason: `Could not parse agent-targets.json: ${error instanceof Error ? error.message : String(error)}`,
    };
  }
}
''')

          app = root / 'code-intel/core/src/cli/app.ts'
          app_text = app.read_text()
          import_anchor = "import { AGENT_OPTIONS, isValidRepoRelativeTargetPath, resolveBuiltinTarget } from './agent-targets.js';"
          import_replacement = import_anchor + "\nimport { resolveSetupPlan, type SetupPlan } from './setup-plan.js';"
          if import_anchor not in app_text:
              raise SystemExit('agent-targets import anchor missing')
          app_text = app_text.replace(import_anchor, import_replacement, 1)

          start_marker = '// ─── 1. setup ────────────────────────────────────────────────────────────────'
          end_marker = '// ─── 2. analyze ──────────────────────────────────────────────────────────────'
          start = app_text.index(start_marker)
          end = app_text.index(end_marker)
          new_block = r'''// ─── 1. setup ────────────────────────────────────────────────────────────────
type SetupIntegrationResult = HookInstallResult & { integration: string };

function printSetupSelection(plan: SetupPlan): void {
  console.log(`  Repository: ${plan.repositoryRoot}`);
  console.log(`  Selection: ${plan.selectionStatus}`);
  if (plan.selectedAgents.length > 0) {
    console.log(`  Selected agents: ${plan.selectedAgents.join(', ')}`);
  }
  if (plan.unknownAgents.length > 0) {
    console.log(`  Unknown agent IDs skipped: ${plan.unknownAgents.join(', ')}`);
  }
  if (plan.reason) console.log(`  Note: ${plan.reason}`);
}

program
  .command('setup')
  .description('Configure MCP and selected-agent global integrations')
  .argument('[path]', 'Repository whose saved agent selection should be used', '.')
  .option('--completion', 'Auto-install shell completion for the detected shell')
  .option('--all-agents', 'Install every supported global integration (never project rules files)')
  .option('--mcp-only', 'Configure MCP without installing agent hooks or plugins')
  .option('--dry-run', 'Print the setup plan without writing files')
  .addHelpText('after', `
  Setup reads <repo>/.code-intel/agent-targets.json, which is created by
  code-intel analyze. Project-scoped instruction files remain owned by analyze.

  Examples:
    $ code-intel setup
    $ code-intel setup ./services/api
    $ code-intel setup --mcp-only
    $ code-intel setup --all-agents
    $ code-intel setup --dry-run
    $ code-intel setup --completion
`)
  .action((targetPath: string, opts: {
    completion?: boolean;
    allAgents?: boolean;
    mcpOnly?: boolean;
    dryRun?: boolean;
  }) => {
    if (opts.completion) {
      if (opts.dryRun) {
        console.log('  Dry run: shell completion would be installed.');
      } else {
        autoInstallCompletion();
      }
      return;
    }

    const plan = resolveSetupPlan(targetPath, { allAgents: opts.allAgents });
    console.log('\n  ◈  Code Intelligence — MCP Setup\n');
    printSetupSelection(plan);

    const mcpConfig = {
      mcpServers: {
        'code-intel': {
          command: 'npx',
          args: ['code-intel', 'mcp', '.'],
        },
      },
    };

    if (opts.dryRun) {
      console.log('\n  MCP: would configure code-intel');
      console.log(`  Global integrations: ${opts.mcpOnly ? '(skipped by --mcp-only)' : plan.integrations.join(', ') || '(none)'}`);
      console.log('  Project instruction files: no writes (managed by code-intel analyze)\n');
      if (plan.selectionStatus === 'invalid') process.exitCode = 1;
      return;
    }

    console.log('\n  Add the following to your editor MCP configuration:\n');
    console.log('  ' + JSON.stringify(mcpConfig, null, 2).split('\n').join('\n  '));

    const configDir = process.env.HOME ? path.join(process.env.HOME, '.config', 'claude') : null;
    if (configDir) {
      const configFile = path.join(configDir, 'claude_desktop_config.json');
      try {
        let existing: Record<string, unknown> = {};
        if (fs.existsSync(configFile)) {
          existing = JSON.parse(fs.readFileSync(configFile, 'utf-8')) as Record<string, unknown>;
        }
        const merged = {
          ...existing,
          mcpServers: {
            ...(existing.mcpServers as Record<string, unknown> ?? {}),
            ...mcpConfig.mcpServers,
          },
        };
        fs.mkdirSync(configDir, { recursive: true });
        const tmp = `${configFile}.tmp-${process.pid}-${Date.now()}`;
        fs.writeFileSync(tmp, JSON.stringify(merged, null, 2) + '\n', 'utf-8');
        fs.renameSync(tmp, configFile);
        console.log(`\n  ✅  MCP configuration written to ${configFile}`);
      } catch (error) {
        Logger.warn(`Could not write MCP configuration: ${error instanceof Error ? error.message : String(error)}`);
        console.log('  Please add the MCP configuration manually.');
      }
    }

    if (opts.mcpOnly) {
      console.log('\n  ◈  Setup complete (MCP only).\n');
      return;
    }

    if (plan.selectionStatus === 'missing') {
      console.log('\n  ℹ  No saved agent selection found.');
      console.log('     Run `code-intel analyze` in this repository, then rerun `code-intel setup`.\n');
      return;
    }
    if (plan.selectionStatus === 'invalid') {
      console.error(`\n  ✗  Invalid agent selection: ${plan.reason ?? plan.selectionPath}`);
      console.error('     Agent integrations were not installed.\n');
      process.exitCode = 1;
      return;
    }

    const results: SetupIntegrationResult[] = [];
    const run = (
      integration: SetupPlan['integrations'][number],
      installer: () => HookInstallResult,
    ): void => {
      if (!plan.integrations.includes(integration)) return;
      results.push({ integration, ...installer() });
    };

    run('claude-hook', installClaudeHook);
    run('cursor-hook', installCursorHook);
    run('gemini-hook', installGeminiHook);
    run('opencode-plugin', installOpenCodePlugin);

    console.log('\n  Agent integrations:');
    if (results.length === 0) console.log('  ℹ  No selected agent has a supported global integration.');
    for (const result of results) {
      const icon = result.result === 'installed' || result.result === 'already-present' ? '✅' : 'ℹ';
      const detail = result.result === 'skipped' ? `: ${result.reason}` : '';
      console.log(`  ${icon}  ${result.integration}: ${result.result}${detail}`);
    }

    console.log('\n  Project instruction files were not modified; they remain managed by `code-intel analyze`.');
    console.log('\n  ◈  Setup complete.\n');
  });

'''
          app_text = app_text[:start] + new_block + app_text[end:]
          app.write_text(app_text)

          test = root / 'code-intel/core/tests/unit/cli/setup-plan.test.ts'
          test.write_text(r'''import { describe, it, afterEach } from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';
import { resolveSetupPlan } from '../../../src/cli/setup-plan.js';

const created: string[] = [];

function makeRepo(): string {
  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'code-intel-setup-plan-'));
  created.push(dir);
  return dir;
}

afterEach(() => {
  while (created.length > 0) fs.rmSync(created.pop()!, { recursive: true, force: true });
});

describe('resolveSetupPlan', () => {
  it('returns missing and installs no agents when selection is absent', () => {
    const plan = resolveSetupPlan(makeRepo());
    assert.equal(plan.selectionStatus, 'missing');
    assert.deepEqual(plan.integrations, []);
  });

  it('resolves only integrations declared by selected agents', () => {
    const repo = makeRepo();
    fs.mkdirSync(path.join(repo, '.code-intel'), { recursive: true });
    fs.writeFileSync(path.join(repo, '.code-intel', 'agent-targets.json'), JSON.stringify({
      selectedAgents: ['cursor', 'copilot', 'kilocode'],
      targets: {
        cursor: { agentId: 'cursor', label: 'Cursor', path: '.cursor/rules/code-intel.mdc', format: 'markdown' },
        copilot: { agentId: 'copilot', label: 'Copilot', path: '.github/copilot-instructions.md', format: 'markdown' },
        kilocode: { agentId: 'kilocode', label: 'Kilo Code', path: 'AGENTS.md', format: 'markdown' },
      },
    }));
    const plan = resolveSetupPlan(repo);
    assert.equal(plan.selectionStatus, 'valid');
    assert.deepEqual(plan.integrations, ['cursor-hook']);
    assert.ok(!plan.integrations.includes('opencode-plugin'));
  });

  it('fails closed for malformed selection', () => {
    const repo = makeRepo();
    fs.mkdirSync(path.join(repo, '.code-intel'), { recursive: true });
    fs.writeFileSync(path.join(repo, '.code-intel', 'agent-targets.json'), '{ invalid');
    const plan = resolveSetupPlan(repo);
    assert.equal(plan.selectionStatus, 'invalid');
    assert.deepEqual(plan.integrations, []);
  });

  it('reports unknown agents without guessing an integration', () => {
    const repo = makeRepo();
    fs.mkdirSync(path.join(repo, '.code-intel'), { recursive: true });
    fs.writeFileSync(path.join(repo, '.code-intel', 'agent-targets.json'), JSON.stringify({
      selectedAgents: ['cursor', 'future-agent'],
      targets: {},
    }));
    const plan = resolveSetupPlan(repo);
    assert.deepEqual(plan.integrations, ['cursor-hook']);
    assert.deepEqual(plan.unknownAgents, ['future-agent']);
  });

  it('all-agents includes every supported global integration only', () => {
    const plan = resolveSetupPlan(makeRepo(), { allAgents: true });
    assert.equal(plan.selectionStatus, 'all-agents');
    assert.deepEqual(new Set(plan.integrations), new Set([
      'claude-hook',
      'cursor-hook',
      'gemini-hook',
      'opencode-plugin',
    ]));
  });
});
''')

          workflow = root / '.github/workflows/implement-agent-setup.yml'
          workflow.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck core
        run: npm run typecheck --workspace=code-intel/core

      - name: Compile and run setup planner tests
        shell: bash
        run: |
          npx tsc -b code-intel/core/tsconfig.test.json
          NODE_ENV=test node --test code-intel/core/dist-tests/tests/unit/cli/setup-plan.test.js

      - name: Build core
        run: npm run build --workspace=code-intel/core

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make setup respect selected agents"
          git push origin HEAD:branch/1.0.10
