name: Clean embedding staging artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-embedding-selector.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove temporary patch transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/v1-0-10-*
          rm -f .github/patches/embedding-selector.*
          rm -f .github/workflows/apply-v1-0-10-four-proposals.yml
          rm -f .github/workflows/apply-embedding-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove v1.0.10 patch staging artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
