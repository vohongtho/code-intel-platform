name: Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-readiness:
    if: github.head_ref == 'release/1.0.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8
          fetch-depth: 0

      - name: Fix parser metadata preservation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('code-intel/core/src/cli/app.ts')
          text = app.read_text()
          old_import = "import { saveMetadata, loadMetadata, getDbPath, getVectorDbPath, loadAgentTargets, saveAgentTargets, computeIndexVersion, resolveEmbeddingMode, shouldRebuildEmbeddings, resolveAnalyzeMode, type AgentTargetConfig, type AgentTargetSelection, type AgentTargetFormat, type EmbeddingMetadata } from '../storage/metadata.js';"
          new_import = "import { saveMetadata, loadMetadata, getDbPath, getVectorDbPath, loadAgentTargets, saveAgentTargets, computeIndexVersion, resolveEmbeddingMode, shouldRebuildEmbeddings, resolveAnalyzeMode, resolveParserForMetadata, type AgentTargetConfig, type AgentTargetSelection, type AgentTargetFormat, type EmbeddingMetadata } from '../storage/metadata.js';"
          if old_import not in text:
              raise SystemExit('metadata import not found')
          text = text.replace(old_import, new_import, 1)
          old_line = "      parser: context.parserUsed ?? 'regex',"
          new_line = "      parser: resolveParserForMetadata(context.parserUsed, previousMetadata),"
          if old_line not in text:
              raise SystemExit('parser metadata line not found')
          text = text.replace(old_line, new_line, 1)
          app.write_text(text)

          metadata = Path('code-intel/core/src/storage/metadata.ts')
          text = metadata.read_text()
          anchor = "export function resolveAnalyzeMode(args: {\n"
          helper = """export function resolveParserForMetadata(\n  parserUsed: IndexMetadata['parser'] | undefined,\n  previousMetadata?: IndexMetadata | null,\n): NonNullable<IndexMetadata['parser']> {\n  // A zero-change incremental run and some legacy-generation migration paths do\n  // not execute the parse phase. Preserve the parser provenance already attached\n  // to the published graph instead of incorrectly downgrading it to regex.\n  if (parserUsed) return parserUsed;\n  if (previousMetadata?.parser) return previousMetadata.parser;\n\n  // Metadata created before parser provenance existed came from the old regex\n  // pipeline. Keep it blocked by `serve` until a real parse phase rebuilds it.\n  return 'regex';\n}\n\n"""
          if 'export function resolveParserForMetadata' not in text:
              if anchor not in text:
                  raise SystemExit('metadata helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          metadata.write_text(text)

          test = Path('code-intel/core/tests/unit/storage/metadata-parser.test.ts')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport { resolveParserForMetadata } from '../../../src/storage/metadata.js';\n\ndescribe('resolveParserForMetadata', () => {\n  it('uses parser provenance from the parse phase', () => {\n    expect(resolveParserForMetadata('tree-sitter', {\n      indexedAt: '2026-07-31T00:00:00.000Z',\n      parser: 'regex',\n      stats: { nodes: 1, edges: 0, files: 1, duration: 1 },\n    })).toBe('tree-sitter');\n  });\n\n  it('preserves tree-sitter metadata when a zero-change run skips parsing', () => {\n    expect(resolveParserForMetadata(undefined, {\n      indexedAt: '2026-07-31T00:00:00.000Z',\n      parser: 'tree-sitter',\n      stats: { nodes: 1, edges: 0, files: 1, duration: 1 },\n    })).toBe('tree-sitter');\n  });\n\n  it('preserves a legacy regex marker until a real rebuild runs', () => {\n    expect(resolveParserForMetadata(undefined, {\n      indexedAt: '2026-07-29T00:00:00.000Z',\n      parser: 'regex',\n      stats: { nodes: 1, edges: 0, files: 1, duration: 1 },\n    })).toBe('regex');\n  });\n\n  it('treats metadata without parser provenance as legacy regex', () => {\n    expect(resolveParserForMetadata(undefined, {\n      indexedAt: '2026-07-29T00:00:00.000Z',\n      stats: { nodes: 1, edges: 0, files: 1, duration: 1 },\n    })).toBe('regex');\n  });\n});\n""")

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = "### 🔍 Truthful vector fallback reporting\n"
          note = "- Fixed v1.0.7 → v1.0.8 migration/zero-change analysis metadata so a tree-sitter index is not incorrectly rewritten as `parser: regex`; `code-intel serve` now accepts the rebuilt index without requesting another analysis.\n"
          if note not in text:
              insertion = "### 🧩 Parser metadata migration\n\n" + note + "- Legacy indexes that genuinely have `parser: regex` or no parser provenance remain blocked until a real tree-sitter rebuild succeeds.\n\n"
              if marker not in text:
                  raise SystemExit('changelog insertion marker not found')
              text = text.replace(marker, insertion + marker, 1)
          changelog.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add code-intel/core/src/cli/app.ts code-intel/core/src/storage/metadata.ts code-intel/core/tests/unit/storage/metadata-parser.test.ts CHANGELOG.md
          git commit -m 'fix: preserve tree-sitter parser metadata after upgrade'
          git push origin HEAD:release/1.0.8
