name: Incremental & No-Op Regression (PR)

# NOTE: despite the historical workflow filename, this is a PR-time
# regression gate for atomic-analyze/no-op/incremental-vs-full-rebuild
# semantics — it is NOT the release-candidate gate for tagging a version.
# The authoritative pre-release gate for `v*.*.*` publication readiness is
# `.github/workflows/release-validate.yml` (release/** pushes + manual
# dispatch). Version assertions below are read dynamically from
# code-intel/core/package.json so this workflow never goes stale across
# releases the way a hardcoded version check would.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --include=optional
      - name: Rebuild required native modules
        run: npm rebuild tree-sitter tree-sitter-typescript tree-sitter-javascript tree-sitter-python tree-sitter-java tree-sitter-go tree-sitter-rust tree-sitter-c tree-sitter-cpp tree-sitter-c-sharp tree-sitter-php tree-sitter-ruby tree-sitter-kotlin tree-sitter-swift @ladybugdb/core onnxruntime-node sharp protobufjs || true
      - name: Verify release metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('code-intel/core/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const locked = lock.packages?.['code-intel/core']?.version;
          // Version is read dynamically (not hardcoded) — this workflow only
          // proves internal consistency between package.json and the
          // lockfile, not "what version should this release be".
          if (locked !== pkg.version) throw new Error(`package-lock core version ${locked} != package version ${pkg.version}`);
          NODE
      # This workflow only exercises CLI/incremental-analysis behavior and
      # intentionally does not build the Web UI, so it opts out of Core's
      # web-asset requirement (see copy-grammars.mjs). A core-only build is
      # NOT a release-ready package — full package validation (`validate:dist`,
      # which now inspects tarball contents including dist/web/) belongs to
      # release-validate.yml, not this PR-time regression check.
      - name: Build distributable (core-only, no Web UI)
        env:
          CODE_INTEL_SKIP_WEB_ASSETS: '1'
        run: npm run build --workspace=code-intel/core
      - name: CLI version smoke test
        run: |
          expected_version=$(node -p "require('./code-intel/core/package.json').version")
          test "$(node code-intel/core/dist/cli/main.js --version)" = "$expected_version"
      - name: Atomic analyze, no-op, setup, and trust smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/code-intel/core/dist/cli/main.js"
          repo="$(mktemp -d)"
          mkdir -p "$repo/src"
          printf 'export function hello(name: string) { return `Hello ${name}`; }\n' > "$repo/src/hello.ts"
          printf '.code-intel/\n.codeintelignore.local\n' > "$repo/.gitignore"
          git -C "$repo" init -q
          git -C "$repo" config user.email test@example.com
          git -C "$repo" config user.name Test
          git -C "$repo" add .
          git -C "$repo" commit -qm initial

          node "$cli" analyze --skip-embeddings "$repo"
          test -f "$repo/.code-intel/current.json"
          node "$cli" index-status "$repo" > "$repo/status.json"
          node --input-type=module - "$repo/status.json" <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (status.state !== 'trusted' || status.trusted !== true || status.fresh !== true) {
            throw new Error(`Expected trusted and fresh index, got ${JSON.stringify(status)}`);
          }
          NODE

          before="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          before_manifest="$(sha256sum "$repo/.code-intel/current.json" | cut -d' ' -f1)"
          generation_count_before="$(find "$repo/.code-intel/generations" -mindepth 1 -maxdepth 1 -type d ! -name '.staging-*' | wc -l | tr -d ' ')"

          node "$cli" analyze --skip-embeddings "$repo" > "$repo/noop-output.txt"
          unchanged="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          after_manifest="$(sha256sum "$repo/.code-intel/current.json" | cut -d' ' -f1)"
          generation_count_after="$(find "$repo/.code-intel/generations" -mindepth 1 -maxdepth 1 -type d ! -name '.staging-*' | wc -l | tr -d ' ')"
          test "$before" = "$unchanged"
          test "$before_manifest" = "$after_manifest"
          test "$generation_count_before" = "$generation_count_after"
          grep -q 'Active generation preserved' "$repo/noop-output.txt"
          test ! -e "$repo/.code-intel/analyze.lock"
          test -z "$(find "$repo/.code-intel/generations" -mindepth 1 -maxdepth 1 -type d -name '.staging-*' -print -quit)"

          cat > "$repo/.code-intel/agent-targets.json" <<'JSON'
          {
            "selectedAgents": ["cursor"],
            "targets": {
              "cursor": {
                "agentId": "cursor",
                "label": "Cursor",
                "path": ".cursor/rules/code-intel.mdc",
                "format": "markdown",
                "builtin": true
              }
            }
          }
          JSON
          node "$cli" setup "$repo" --dry-run > "$repo/setup-dry-run.txt"
          grep -q 'cursor-hook' "$repo/setup-dry-run.txt"
          if grep -q 'claude-hook' "$repo/setup-dry-run.txt"; then
            echo 'Unselected Claude integration appeared in setup plan' >&2
            exit 1
          fi
          test ! -e "$repo/.cursor"
          test ! -e "$repo/.kilocode"
          test ! -e "$repo/.agents"
          test ! -e "$repo/.clinerules"
          test ! -e "$repo/.windsurfrules"
          test ! -e "$repo/AGENTS.md"

          node "$cli" analyze --force --skip-embeddings "$repo"
          node "$cli" index-status "$repo" > "$repo/status-after-force.json"
          after_force="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          test "$before" != "$after_force"
          node --input-type=module - "$repo/status-after-force.json" <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (status.state !== 'trusted' || status.trusted !== true || status.fresh !== true) {
            throw new Error(`Expected trusted index after force analysis, got ${JSON.stringify(status)}`);
          }
          NODE
      - name: Dirty working-tree incremental and full-rebuild equivalence
        shell: bash
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/code-intel/core/dist/cli/main.js"
          npx tsc -b code-intel/core/tsconfig.test.json
          internal="$GITHUB_WORKSPACE/code-intel/core/dist-tests/src"
          repo="$(mktemp -d)"
          mkdir -p "$repo/src"
          for i in $(seq 0 9); do
            printf 'export function BaseSymbol%s() { return %s; }\n' "$i" "$i" > "$repo/src/file$i.ts"
          done
          git -C "$repo" init -q
          git -C "$repo" config user.email test@example.com
          git -C "$repo" config user.name Test
          git -C "$repo" add .
          git -C "$repo" commit -qm initial
          node "$cli" analyze --skip-embeddings "$repo"
          before="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          printf 'export function DirtyTrackedSymbol() { return 101; }\n' > "$repo/src/file0.ts"
          printf 'export function DirtyUntrackedSymbol() { return 202; }\n' > "$repo/src/untracked.ts"
          node "$cli" analyze --skip-embeddings "$repo"
          after="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          test "$before" != "$after"
          (
            cd "$repo"
            node "$cli" search "DirtyTrackedSymbol" --json > tracked-search.json
            node "$cli" search "DirtyUntrackedSymbol" --json > untracked-search.json
          )
          grep -q 'DirtyTrackedSymbol' "$repo/tracked-search.json"
          grep -q 'DirtyUntrackedSymbol' "$repo/untracked-search.json"

          snapshot_graph() {
            local output="$1"
            REPO="$repo" OUTPUT="$output" INTERNAL="$internal" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const internal = process.env.INTERNAL;
          const repo = process.env.REPO;
          const output = process.env.OUTPUT;
          const { createKnowledgeGraph } = await import(pathToFileURL(`${internal}/graph/knowledge-graph.js`));
          const { DbManager } = await import(pathToFileURL(`${internal}/storage/db-manager.js`));
          const { loadGraphFromDB } = await import(pathToFileURL(`${internal}/multi-repo/graph-from-db.js`));
          const { getDbPath } = await import(pathToFileURL(`${internal}/storage/metadata.js`));
          const graph = createKnowledgeGraph();
          const db = new DbManager(getDbPath(repo), true);
          await db.init();
          await loadGraphFromDB(graph, db);
          db.close();
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value)
                .filter(([key]) => !['createdAt', 'updatedAt', 'duration'].includes(key))
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([key, item]) => [key, canonical(item)]));
            }
            return value;
          };
          const nodes = [...graph.allNodes()]
            .map(canonical)
            .sort((a, b) => String(a.id).localeCompare(String(b.id)));
          const edges = [...graph.allEdges()]
            .map(canonical)
            .sort((a, b) => String(a.id).localeCompare(String(b.id)));
          fs.writeFileSync(output, JSON.stringify({ nodes, edges }, null, 2));
          NODE
          }

          snapshot_graph "$repo/incremental-graph.json"
          node "$cli" analyze --force --skip-embeddings "$repo"
          snapshot_graph "$repo/full-graph.json"
          cmp "$repo/incremental-graph.json" "$repo/full-graph.json"
      - name: Incremental embeddings regression
        run: npm test --workspace=code-intel/core -- --test-name-pattern="embeddings|EmbeddingUpdatePlan"
      - name: Security gate
        run: npm audit --audit-level=high
