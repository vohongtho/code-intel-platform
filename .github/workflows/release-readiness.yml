name: Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --include=optional
      - name: Rebuild required native modules
        run: npm rebuild tree-sitter tree-sitter-typescript tree-sitter-javascript tree-sitter-python tree-sitter-java tree-sitter-go tree-sitter-rust tree-sitter-c tree-sitter-cpp tree-sitter-c-sharp tree-sitter-php tree-sitter-ruby tree-sitter-kotlin tree-sitter-swift @ladybugdb/core onnxruntime-node sharp protobufjs || true
      - name: Verify release metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('code-intel/core/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const locked = lock.packages?.['code-intel/core']?.version;
          if (pkg.version !== '1.0.8') throw new Error(`Expected package version 1.0.8, got ${pkg.version}`);
          if (locked !== pkg.version) throw new Error(`package-lock core version ${locked} != package version ${pkg.version}`);
          NODE
      - name: Build distributable
        run: npm run build --workspace=code-intel/core
      - name: Validate npm package
        run: npm run validate:dist --workspace=code-intel/core
      - name: CLI version smoke test
        run: test "$(node code-intel/core/dist/cli/main.js --version)" = "1.0.8"
      - name: Atomic analyze and trust smoke test
        shell: bash
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          mkdir -p "$repo/src"
          printf 'export function hello(name: string) { return `Hello ${name}`; }\n' > "$repo/src/hello.ts"
          node code-intel/core/dist/cli/main.js analyze --skip-git --skip-embeddings "$repo"
          test -f "$repo/.code-intel/current.json"
          node code-intel/core/dist/cli/main.js index-status "$repo" > "$repo/status.json"
          node --input-type=module - "$repo/status.json" <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (status.state !== 'trusted' || status.trusted !== true || status.fresh !== true) {
            throw new Error(`Expected trusted and fresh index, got ${JSON.stringify(status)}`);
          }
          NODE
          before="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          node code-intel/core/dist/cli/main.js analyze --force --skip-git --skip-embeddings "$repo"
          node code-intel/core/dist/cli/main.js index-status "$repo" > "$repo/status-after-force.json"
          after="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          test "$before" != "$after"
          node --input-type=module - "$repo/status-after-force.json" <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (status.state !== 'trusted' || status.trusted !== true || status.fresh !== true) {
            throw new Error(`Expected trusted index after force analysis, got ${JSON.stringify(status)}`);
          }
          NODE
      - name: Dirty working-tree incremental and full-rebuild equivalence
        shell: bash
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/code-intel/core/dist/cli/main.js"
          npx tsc -b code-intel/core/tsconfig.test.json
          internal="$GITHUB_WORKSPACE/code-intel/core/dist-tests/src"
          repo="$(mktemp -d)"
          mkdir -p "$repo/src"
          for i in $(seq 0 9); do
            printf 'export function BaseSymbol%s() { return %s; }\n' "$i" "$i" > "$repo/src/file$i.ts"
          done
          git -C "$repo" init -q
          git -C "$repo" config user.email test@example.com
          git -C "$repo" config user.name Test
          git -C "$repo" add .
          git -C "$repo" commit -qm initial
          node "$cli" analyze --skip-embeddings "$repo"
          before="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          printf 'export function DirtyTrackedSymbol() { return 101; }\n' > "$repo/src/file0.ts"
          printf 'export function DirtyUntrackedSymbol() { return 202; }\n' > "$repo/src/untracked.ts"
          node "$cli" analyze --skip-embeddings "$repo"
          after="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).generationId)" "$repo/.code-intel/current.json")"
          test "$before" != "$after"
          (
            cd "$repo"
            node "$cli" search "DirtyTrackedSymbol" --json > tracked-search.json
            node "$cli" search "DirtyUntrackedSymbol" --json > untracked-search.json
          )
          grep -q 'DirtyTrackedSymbol' "$repo/tracked-search.json"
          grep -q 'DirtyUntrackedSymbol' "$repo/untracked-search.json"

          snapshot_graph() {
            local output="$1"
            REPO="$repo" OUTPUT="$output" INTERNAL="$internal" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const internal = process.env.INTERNAL;
          const repo = process.env.REPO;
          const output = process.env.OUTPUT;
          const { createKnowledgeGraph } = await import(pathToFileURL(`${internal}/graph/knowledge-graph.js`));
          const { DbManager } = await import(pathToFileURL(`${internal}/storage/db-manager.js`));
          const { loadGraphFromDB } = await import(pathToFileURL(`${internal}/storage/graph-loader.js`));
          const { getDbPath } = await import(pathToFileURL(`${internal}/storage/metadata.js`));
          const graph = createKnowledgeGraph();
          const db = new DbManager(getDbPath(repo), true);
          await db.init();
          await loadGraphFromDB(graph, db);
          db.close();
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value)
                .filter(([key]) => !['createdAt', 'updatedAt', 'duration'].includes(key))
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([key, item]) => [key, canonical(item)]));
            }
            return value;
          };
          const nodes = [...graph.allNodes()]
            .map(canonical)
            .sort((a, b) => String(a.id).localeCompare(String(b.id)));
          const edges = [...graph.allEdges()]
            .map(canonical)
            .sort((a, b) => String(a.id).localeCompare(String(b.id)));
          fs.writeFileSync(output, JSON.stringify({ nodes, edges }, null, 2));
          NODE
          }

          snapshot_graph "$repo/incremental-graph.json"
          node "$cli" analyze --force --skip-embeddings "$repo"
          snapshot_graph "$repo/full-graph.json"
          cmp "$repo/incremental-graph.json" "$repo/full-graph.json"
      - name: Security gate
        run: npm audit --audit-level=high
