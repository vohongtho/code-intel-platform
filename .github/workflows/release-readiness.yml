name: Apply v1.0.9 Incremental Vector Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-reviewed-fix:
    if: github.head_ref == 'release/1.0.9'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source patch
        run: python scripts/prepare-v1.0.9.py
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --include=optional
      - name: Rebuild native modules
        run: npm rebuild tree-sitter tree-sitter-typescript tree-sitter-javascript tree-sitter-python tree-sitter-java tree-sitter-go tree-sitter-rust tree-sitter-c tree-sitter-cpp tree-sitter-c-sharp tree-sitter-php tree-sitter-ruby tree-sitter-kotlin tree-sitter-swift @ladybugdb/core onnxruntime-node sharp protobufjs || true
      - name: Build, test, package, and audit
        run: |
          npm run build --workspace=code-intel/core
          npm test --workspace=code-intel/core
          npm run validate:dist --workspace=code-intel/core
          test "$(node code-intel/core/dist/cli/main.js --version)" = "1.0.9"
          npm audit --audit-level=high
      - name: Restore release workflow and commit verified fix
        run: |
          git show HEAD^:.github/workflows/release-readiness.yml > .github/workflows/release-readiness.yml
          rm -f scripts/prepare-v1.0.9.py docs/releases/v1.0.9-work-in-progress.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: decouple vector updates from graph rebuild mode"
          git push origin HEAD:release/1.0.9
